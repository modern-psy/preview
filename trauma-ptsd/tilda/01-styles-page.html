.decision-after_component {
  align-items: center;
  gap: clamp(2.5rem, 2.857vw, 3rem);
}

.decision-after_heading {

  text-align: center;
}

.decision-after_media {
  display: grid;
  width: 100%;
  min-width: 0;
  gap: 0.5rem;
}

.decision-after_image-frame {
  position: relative;
  min-width: 0;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-card);
  background: var(--color-surface-dark);
  isolation: isolate;
}

.decision-after_image-frame::after {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    0deg,
    rgb(17 23 1 / 80%) 0%,
    rgb(30 40 3 / 0%) 62.06%
  );
  content: "";
  pointer-events: none;
}

.decision-after_image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.skill-outcomes_intro {
  width: 100%;
}

.skill-outcomes_layout {
  width: 100%;
}

.skill-outcomes_image {
  object-position: center 58%;
}

.program-layout_component,
.program-overview_component,
.program-overview_intro,
.program-overview_copy,
.program-modules_component,
.program-module_panel,
.program-module_topic-group,
.teachers_component,
.teachers_intro,
.teacher-card_component,
.teacher-card_copy,
.education_copy,
.education_intro,
.education_license {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
}

.program-layout_component {
  gap: clamp(2.5rem, 6.835vw, 4.375rem);
}

.program-overview_component {
  align-self: start;
  align-items: center;
  gap: 1rem;
}

.program-overview_intro {
  align-items: center;
  gap: 1.5rem;
}

.program-overview_copy.section-heading_component {
  align-items: center;
  text-align: center;
}

.program-overview_badge {
  display: inline-flex;
  min-height: 2.1875rem;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.75rem;
  border-radius: 999px;
  background: var(--color-accent-primary);
  color: var(--color-text-on-dark);
  font-size: clamp(0.9375rem, 1.758vw, 1.125rem);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.program-overview_badge img {
  display: block;
  width: 1.25rem;
  height: 1.25rem;
  flex: none;
}

.program-overview_heading {
  color: var(--color-text-primary);
  font-size: clamp(2rem, 3.516vw, 2.25rem);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.03em;
}

.program-overview_description {
  max-width: 29.3125rem;
}

.program-overview_schedule {
  display: flex;
  width: 100%;
  margin: 0;
  padding: 0.625rem 0;
  flex-direction: column;
  gap: 1rem;
  border-top: 0.25px solid var(--color-text-secondary-large);
  border-bottom: 0.25px solid var(--color-text-secondary-large);
}

.program-overview_schedule div {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.program-overview_schedule dt,
.program-overview_schedule dd {
  margin: 0;
}

.program-overview_schedule dt {
  color: var(--color-text-secondary-large);
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1.4;
}

.program-overview_schedule dd {
  color: var(--color-text-primary);
  font-size: 1.125rem;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.program-overview_download {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  color: var(--color-text-primary);
  font-size: 1.125rem;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.01em;
  transition: color var(--transition-site);
}

.program-overview_download img {
  display: block;
  width: 1.5rem;
  height: 1.5rem;
  flex: none;
}

.program-overview_download span {
  text-decoration: underline;
  text-decoration-thickness: from-font;
  text-underline-position: from-font;
}

.program-overview_download:hover {
  color: var(--color-text-secondary-large);
}

.program-overview_download:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 0.25rem;
  border-radius: 0.25rem;
}

.program-modules_component {
  gap: 1rem;
}

.program-module_item {
  padding: 1rem;
  border-radius: var(--radius-card);
  background: var(--color-surface-primary);
}

.program-module_summary {
  display: flex;
  min-height: 4.75rem;
  flex-direction: column;
  gap: 0.75rem;
  color: var(--color-text-primary);
}

.program-module_summary-main {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr) 2.75rem;
  align-items: start;
  gap: 1rem;
}

.program-module_title-row {
  display: grid;
  min-width: 0;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 0.75rem;
}

.program-module_badge {
  display: inline-flex;
  min-height: 2.0625rem;
  align-items: center;
  justify-content: center;
  padding: 0.375rem 0.75rem;
  border-radius: 0.5rem;
  background: var(--color-text-primary);
  color: var(--color-text-on-dark);
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.program-module_title {
  min-width: 0;
  font-size: clamp(1.125rem, 2.419vw, 1.5rem);
  font-weight: 500;
  line-height: 1.1;
  font-feature-settings: "lnum" 1, "pnum" 1;
  text-wrap: pretty;
}

.program-module_summary .accordion_icon {
  margin: 0 0.34375rem;
  justify-self: end;
}

.program-module_meta {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  color: var(--color-text-secondary-large);
  font-size: clamp(1rem, 1.758vw, 1.125rem);
  font-weight: 600;
  line-height: 1.4;
}

.program-module_meta img {
  display: block;
  width: 1.25rem;
  height: 1.25rem;
  flex: none;
}

.program-module_panel {
  gap: 0.9375rem;
  padding-top: 2rem;
}

.program-module_description {
  color: var(--color-text-secondary-large);
  font-size: var(--text-body-size);
  font-weight: 400;
  line-height: var(--text-body-line-height);
}

.program-module_topic-group {
  gap: 0.5rem;
}

.program-module_topic-heading {
  color: var(--color-text-secondary-large);
  font-size: var(--text-body-size);
  font-weight: 600;
  line-height: var(--text-body-line-height);
}

.program-module_topic-list {
  display: flex;
  width: 100%;
  flex-direction: column;
  gap: 0.25rem;
}

.program-module_topic-list li {
  position: relative;
  padding-left: 0.75rem;
  color: var(--color-text-primary);
  font-size: clamp(1rem, 1.758vw, 1.125rem);
  font-weight: 400;
  line-height: 1.4;
}

.program-module_topic-list li::before {
  position: absolute;
  top: 0.58em;
  left: 0;
  width: 0.375rem;
  height: 0.375rem;
  border-radius: 50%;
  background: var(--color-accent-primary);
  content: "";
}

.program-modules_action {
  width: 100%;
}

.teachers_component {
  gap: 3rem;
}

.teachers_header {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
  align-items: flex-start;
  gap: 1.5rem;
}

.teachers_intro {
  max-width: 52.0625rem;
}

.teachers_heading {
  color: var(--color-text-primary);
  font-size: clamp(2.25rem, 5.078vw, 3.25rem);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.06em;
  text-wrap: balance;
}

.teachers_controls {
  display: none;
}

.teachers_control {
  display: inline-flex;
  width: 2.75rem;
  height: 2.75rem;
  flex: none;
  align-items: center;
  justify-content: center;
  padding: 0.125rem;
  border: 0;
  border-radius: 0.625rem;
  background: var(--color-text-primary);
  cursor: pointer;
  transition:
    background-color var(--transition-site),
    opacity var(--transition-site);
}

.teachers_control.is-previous img {
  transform: rotate(180deg);
}

.teachers_control img {
  display: block;
  width: 1.375rem;
  height: 1.375rem;
}

.teachers_control-icon.is-muted {
  display: none;
}

.teachers_control:hover:not(:disabled) {
  background: #514c5d;
}

.teachers_control:disabled {
  background: #d0cdd9;
  cursor: default;
}

.teachers_control:disabled .teachers_control-icon.is-active {
  display: none;
}

.teachers_control:disabled .teachers_control-icon.is-muted {
  display: block;
}

.teachers_control:focus-visible,
.teachers_slider:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 0.25rem;
}

.teachers_slider {
  width: 100%;
  visibility: visible;
}

.teachers_slider .splide__track {
  overflow: visible;
}

.teachers_list {
  display: grid;
  width: 100%;
  min-width: 0;
  align-items: start;
  gap: 2rem;
}

.teachers_slide {
  width: 100%;
  min-width: 0;
}

.teacher-card_component {
  gap: 1rem;
}

.teacher-card_media {
  width: 100%;
  aspect-ratio: 1200 / 1279;
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-card);
  background: #d9d9d9;
}

.teacher-card_image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.teacher-card_copy {
  gap: var(--content-heading-gap);
}

.teacher-card_name {
  color: var(--color-text-primary);
  font-size: clamp(1.5rem, 3.125vw, 2rem);
  font-weight: 400;
  line-height: 1.1;
  font-feature-settings: "lnum" 1, "pnum" 1;
  text-wrap: pretty;
}

.teacher-card_description {
  color: var(--color-text-secondary-large);
  font-size: var(--text-body-size);
  font-weight: 400;
  line-height: var(--text-body-line-height);
  font-feature-settings: "lnum" 1, "pnum" 1;
}

.education_component {
  display: grid;
  width: 100%;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr);
  gap: 2rem;
}

.education_copy {
  display: contents;
  justify-content: space-between;
  gap: 2rem;
}

.education_intro {
  order: 1;
}

.education_media {
  order: 2;
}

.education_license {
  order: 3;
  margin-top: -0.5rem;
}

.education_heading {
  color: var(--color-text-primary);
  font-size: clamp(2rem, 3.516vw, 2.25rem);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

.education_license {
  align-items: center;
  color: var(--color-text-secondary-large);
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.4;
  text-align: center;
}

.education_license a {
  text-decoration: underline;
  text-underline-position: from-font;
  transition: color var(--transition-site);
}

.education_license a:hover {
  color: var(--color-accent-primary);
}

.education_license a:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 0.1875rem;
}

.education_media {
  position: relative;
  min-width: 0;
  aspect-ratio: 1440 / 618;
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-card);
  background: var(--color-surface-primary);
}

.education_image {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

@media screen and (min-width: 48rem) {
  .trauma-page {
    --content-panel-padding: 1.5rem;
    --lead-form-control-font-size: 1.125rem;
  }

  .trauma-page .iti__country-selector,
  body > .iti--detached-country-selector {
    font-size: 1.125rem;
  }

  .payment-options_grid {
    gap: 0.5rem;
  }

  .decision-card_grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .decision-after_image-frame {
    aspect-ratio: 16 / 9;
  }

  .program-modules_action {
    width: min(100%, 28.375rem);
  }

  .teachers_header {
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
  }

  .teachers_controls {
    display: flex;
    flex: none;
    align-items: center;
    gap: 0.75rem;
  }

  .teachers_list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .teachers_slider.is-initialized .teachers_list {
    display: flex;
  }

  .teachers_slider.is-initialized .teachers_slide {
    width: clamp(20rem, 30.855%, 29.3125rem);
  }

  .education_component {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
    gap: 1rem;
  }

  .education_copy {
    display: flex;
    min-height: 19.75rem;
  }

  .education_intro,
  .education_license,
  .education_media {
    order: initial;
  }

  .education_license {
    align-items: flex-start;
    margin-top: 0;
    text-align: left;
  }

  .education_media {
    height: 100%;
    min-height: 19.75rem;
    aspect-ratio: auto;
  }
}

@media screen and (min-width: 62rem) {
  .payment-options_grid {
    gap: 1rem;
  }

  .lead-form_component {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    align-items: start;
    gap: 2.25rem;
  }

  .challenges_body {
    gap: 1rem;
  }

  .decision-after_media {
    position: relative;
    display: flex;
    min-height: clamp(37.5rem, 41.667vw, 43.75rem);
    align-items: flex-end;
    justify-content: center;
    padding: 3rem;
    overflow: hidden;
    overflow: clip;
    border-radius: var(--radius-card);
    background: var(--color-surface-dark);
  }

  .decision-after_image-frame {
    position: absolute;
    top: -6.25rem;
    right: 0;
    bottom: 0;
    left: 0;
    height: auto;
    aspect-ratio: auto;
    border-radius: 0;
  }

  .decision-card_grid.is-after {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 79rem;
  }

  .skill-outcomes_list {
    min-height: 33.25rem;
    align-content: stretch;
  }

  .program-layout_component {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    align-items: start;
    gap: 2rem;
  }

  .program-overview_component {
    position: sticky;
    top: calc(var(--site-header-height) + var(--sticky-content-gap));
    align-items: stretch;
  }

  .program-overview_intro,
  .program-overview_copy.section-heading_component {
    align-items: flex-start;
    text-align: left;
  }

  .program-overview_schedule div {
    align-items: flex-start;
    text-align: left;
  }

  .program-overview_download {
    justify-content: flex-start;
  }

  .teacher-card_component {
    gap: 1.25rem;
  }

  .program-module_title {
    font-size: 1.5rem;
  }

  .program-module_topic-list li {
    font-size: 1.125rem;
  }

  .teacher-card_name {
    font-size: 2rem;
  }

}

@media screen and (min-width: 32.5625rem) and (max-width: 47.9375rem) {
  .teachers_intro {
    align-items: flex-start;
    text-align: left;
  }

  .teachers_header {
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
  }

  .teachers_controls {
    display: flex;
    flex: none;
    align-items: center;
    gap: 0.75rem;
  }

  .teachers_list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }

  .teachers_slider.is-initialized .teachers_list {
    display: flex;
  }

  .teachers_slider.is-initialized .teachers_slide {
    width: clamp(20rem, 44vw, 29.3125rem);
  }
}

@media screen and (max-width: 48rem) {
  .section_challenges .cta_heading {
    font-size: clamp(1.625rem, 7vw, 1.75rem);
  }
}

@media screen and (max-width: 28.125rem) {
  .program-module_title-row {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .program-overview_download,
  .teachers_control,
  .education_license a,
  .lead-form_input,
  .lead-form_label,
  .lead-form_messenger-option,
  .lead-form_submit,
  .lead-form_success,
  .lead-form_legal a {
    transition-duration: 0.01ms;
  }
}
