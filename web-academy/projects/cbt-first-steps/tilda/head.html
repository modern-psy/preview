.course-speaker_component {
  gap: 3rem;
}

.section_heading.is-course-speaker {
  max-width: 31rem;
}

.course-speaker_profile {
  display: grid;
  width: min(100%, 63rem);
  grid-template-columns: 12.5rem minmax(0, 45.8125rem);
  align-items: center;
  gap: 3.5rem;
}

.course-speaker_media {
  position: relative;
  width: 12.5rem;
  height: 18.5rem;
  flex: none;
}

.course-speaker_portrait-frame {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5rem;
  height: 15.75rem;
  overflow: hidden;
  border: 0.25px solid var(--color-accent-primary);
  border-radius: var(--radius-medium);
  background: #d6d5d6;
  box-shadow:
    -26px 44px 56px rgb(150 150 162 / 10%),
    -104px 176px 102px rgb(150 150 162 / 9%),
    -233px 395px 125px rgb(150 150 162 / 5%),
    -415px 703px 125px rgb(150 150 162 / 1%);
}

.course-speaker_portrait-image {
  position: absolute;
  top: 0;
  left: 50%;
  display: block;
  width: 106%;
  height: 118.37%;
  max-width: none;
  object-fit: cover;
  object-position: center top;
  transform: translateX(-50%);
}

.course-speaker_record {
  position: absolute;
  z-index: 1;
  top: 0.75rem;
  right: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.3125rem;
  color: rgb(245 245 254 / 80%);
  font-size: 0.5rem;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.02em;
}

.course-speaker_record-dot {
  display: block;
  width: 0.75rem;
  height: 0.75rem;
  border-radius: 50%;
  background: #ff435b;
  box-shadow: 0 0 0.375rem rgb(255 67 91 / 55%);
  animation: course-speaker-recording-pulse 1.4s ease-in-out infinite;
}

@keyframes course-speaker-recording-pulse {
  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: 0.35;
  }
}

.course-speaker_control-bar {
  position: absolute;
  top: 16rem;
  left: 0;
  display: grid;
  width: 12.5rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.25rem;
}

.course-speaker_control {
  display: flex;
  height: 2.5rem;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-medium);
  background: #484845;
}

.course-speaker_control img,
.course-speaker_credential-icon img {
  display: block;
  width: 1.5rem;
  height: 1.5rem;
}

.course-speaker_info,
.course-speaker_intro {
  display: flex;
  width: 100%;
  flex-direction: column;
  align-items: flex-start;
}

.course-speaker_info {
  gap: 2rem;
}

.course-speaker_intro {
  gap: 0.75rem;
}

.course-speaker_name,
.course-speaker_description {
  width: 100%;
  color: var(--color-text-primary);
  font-weight: 400;
}

.course-speaker_name {
  font-size: 2rem;
  line-height: 2.125rem;
  letter-spacing: -0.02em;
}

.course-speaker_description {
  font-size: 1.125rem;
  line-height: 1.5625rem;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}

.course-speaker_credentials {
  display: flex;
  width: 100%;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.course-speaker_credential {
  display: flex;
  min-width: 0;
  max-width: 100%;
  min-height: 3.5rem;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem 0.5rem 0.5rem;
  overflow: hidden;
  border: 0.25px solid #dad6ff;
  border-radius: 0.75rem;
  background: var(--color-surface-primary);
  color: var(--color-text-primary);
  font-size: 1.125rem;
  line-height: 1.5625rem;
  letter-spacing: -0.01em;
}

.course-speaker_credential-icon {
  display: flex;
  width: 2.5rem;
  height: 2.5rem;
  flex: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 0.25px solid var(--color-accent-primary);
  border-radius: var(--radius-medium);
  background: var(--color-accent-soft);
}

.grant-cta_component {
  display: flex;
  width: 100%;
  flex-direction: column;
  align-items: center;
  gap: 4.375rem;
  padding: 4rem 5rem;
  border-radius: var(--radius-card);
  background: var(--color-surface-inverse);
}

.grant-cta_content {
  display: flex;
  width: min(100%, 64rem);
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
}

.grant-cta_eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.125rem 0.125rem 0.125rem 0.5rem;
  border-radius: var(--radius-small);
  background: var(--color-promo-background);
  color: var(--color-text-primary);
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
  white-space: nowrap;
}

.grant-cta_eyebrow-icon {
