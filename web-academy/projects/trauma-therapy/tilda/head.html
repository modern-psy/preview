  --grid-color-bright: var(--color-cta-grid-bright);
  --grid-line-color: rgb(93 93 93 / 72%);
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: center;
  padding: var(--cta-padding, 2rem 1rem);
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-card);
  background: var(--color-surface-dark);
  isolation: isolate;
}

.cta_grid {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(
    90deg,
    transparent 0%,
    #000 24%,
    #000 76%,
    transparent 100%
  );
  mask-image: linear-gradient(
    90deg,
    transparent 0%,
    #000 24%,
    #000 76%,
    transparent 100%
  );
  pointer-events: none;
}

.cta_grid.is-tall {
  -webkit-mask-image: none;
  mask-image: none;
}

.cta_grid-scene {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 79rem;
  height: 20.5rem;
  -webkit-mask-image: linear-gradient(
    180deg,
    transparent 0%,
    #000 24%,
    #000 76%,
    transparent 100%
  );
  mask-image: linear-gradient(
    180deg,
    transparent 0%,
    #000 24%,
    #000 76%,
    transparent 100%
  );
  transform: translate(-50%, -50%);
}

.cta_grid-scene.is-tall {
  top: 0;
  width: 74.875rem;
  height: 30.75rem;
  -webkit-mask-image: none;
  mask-image: none;
  transform: translateX(-50%);
}

.cta_grid-image,
.cta_grid-reset-layer,
.cta_grid-highlights,
.cta_grid-cross-layer,
.cta_comet-layer {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.cta_grid-image {
  z-index: 0;
}

.cta_grid-reset-layer {
  z-index: 1;
}

.cta_grid-highlights {
  z-index: 2;
}

.cta_grid-cross-layer {
  z-index: 3;
}

.cta_grid-reset-cell {
  position: absolute;
  top: var(--cta-cell-y);
  left: var(--cta-cell-x);
  width: 6.25rem;
  height: 6.25rem;
  background: var(--color-surface-dark);
  box-shadow: inset 0 0 0 0.25px rgb(93 93 93 / 58%);
}

.cta_grid-cross {
  --cta-cross-size: 0.625rem;
  position: absolute;
  top: calc(var(--cta-cross-y) - (var(--cta-cross-size) / 2));
  left: calc(var(--cta-cross-x) - (var(--cta-cross-size) / 2));
  width: var(--cta-cross-size);
  height: var(--cta-cross-size);
}

.cta_grid-cross::before,
.cta_grid-cross::after {
  position: absolute;
  top: 50%;
  left: 50%;
  border-radius: 999px;
  background: #949494;
  content: "";
  transform: translate(-50%, -50%);
}

.cta_grid-cross::before {
  width: 100%;
  height: 0.5px;
}

.cta_grid-cross::after {
  width: 0.5px;
  height: 100%;
}

.interactive-grid_cell {
  position: absolute;
  top: var(--grid-cell-y);
  left: var(--grid-cell-x);
  width: var(--grid-cell-size, 6.25rem);
  height: var(--grid-cell-size, 6.25rem);
  background: transparent;
  opacity: 0;
  box-shadow: inset 0 0 0 0.25px var(--grid-line-color);
  transition:
    opacity var(--transition-site),
    background-color var(--transition-site);
  transition-delay: var(--grid-cell-delay, 0ms);
  will-change: opacity, background-color;
}

.interactive-grid_cell.is-touch-static {
  transition: none;
  transition-delay: 0ms;
  will-change: auto;
}

.interactive-grid_cell.is-muted {
  z-index: 1;
  background: var(--grid-color-muted);
  opacity: 1;
}

.interactive-grid_cell.is-medium {
  z-index: 2;
  background: var(--grid-color-medium);
  opacity: 1;
}

.interactive-grid_cell.is-bright {
  z-index: 3;
  background: var(--grid-color-bright);

}
