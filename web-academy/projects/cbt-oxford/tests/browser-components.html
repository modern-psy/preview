<!doctype html><html lang="ru"><meta charset="utf-8"><title>КПТ — проверка компонентов</title><style>body{font:14px system-ui}iframe{display:block;border:1px solid #aaa;max-width:none}pre{white-space:pre-wrap;max-height:8rem;overflow:auto}</style><h1>Проверка компонентов КПТ</h1><pre id="result">Выполняется…</pre><div id="frames"></div><script type="module">
const results=[];const check=(name,pass,detail='')=>{results.push({name,pass:!!pass,detail});document.querySelector('#result').textContent=JSON.stringify(results,null,2)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(predicate,timeout=8000){const end=performance.now()+timeout;while(!predicate()){if(performance.now()>end)throw new Error('Animation state timed out');await wait(30)}}
const html=await fetch('../tilda/preview.html').then(r=>r.text());
async function frame(mode){const f=document.createElement('iframe');f.width=1440;f.height=1000;if(mode==='nojs')f.setAttribute('sandbox','allow-same-origin');let code=html;if(mode==='reduced')code=code.replace('<head>',`<head><script>const nativeMatch=window.matchMedia.bind(window);window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:true,media:q,addEventListener(){},removeEventListener(){}}:nativeMatch(q);<\/script>`);document.querySelector('#frames').append(f);const loaded=new Promise(r=>f.onload=r);f.srcdoc=code;await loaded;await wait(200);return f}
try {
 const f=await frame('normal'),d=f.contentDocument,w=f.contentWindow;
 const tabs=d.querySelector('academy-showcase-tabs'),buttons=[...tabs.querySelectorAll('[data-tabs-trigger]')],panels=[...tabs.querySelectorAll('[data-tabs-panel]')];
 check('Tab initialization',buttons[0].getAttribute('aria-selected')==='true'&&panels.filter(p=>!p.hidden).length===1);
 for(let i=0;i<buttons.length;i++){buttons[i].click();check(`Tab ${i+1} selection`,buttons[i].getAttribute('aria-selected')==='true'&&!panels[i].hidden&&panels.filter(p=>!p.hidden).length===1)}
 buttons[4].dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true}));check('Tabs Home keyboard',d.activeElement===buttons[0]&&buttons[0].getAttribute('aria-selected')==='true');
 buttons[0].dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check('Tabs arrow keyboard',d.activeElement===buttons[1]&&buttons[1].getAttribute('aria-selected')==='true');
 buttons[1].dispatchEvent(new w.KeyboardEvent('keydown',{key:'End',bubbles:true}));check('Tabs End keyboard',d.activeElement===buttons[4]);
 // Check real timers and state order; finish only CSS transitions when asserting their end state.
 for(const index of [0,1,3,4]) {
   tabs.scrollIntoView({block:'center'});await wait(100);const started=performance.now();buttons[index].click();
   const canvas=panels[index].querySelector('.oxford-demo_canvas'),card=canvas.querySelector('[data-typewriter-card],[data-sequence-card]'),action=canvas.querySelector('[data-typewriter-reveal],[data-sequence-reveal]');canvas.scrollIntoView({block:'center'});
   await until(()=>card.classList.contains('is-card-visible'));const revealDelay=performance.now()-started;check(`Tab ${index+1} starts card promptly`,w.AcademyDemoMotion.empty===0&&w.AcademyDemoMotion.enter===200&&revealDelay<=300,`${revealDelay}ms`);
   if(index===0||index===1){const source=canvas.querySelector('[data-typewriter-text]'),visual=canvas.querySelector('[data-typewriter-visual]');check(`Tab ${index+1} card before typing`,visual.textContent==='');await until(()=>visual.textContent===source.textContent);const typedAt=performance.now();await wait(250);check(`Tab ${index+1} pause before action`,!action.classList.contains('is-revealed'));await until(()=>action.classList.contains('is-revealed'));check(`Tab ${index+1} half-second text/action gap`,performance.now()-typedAt>=450)}
   if(index===3){const steps=[...canvas.querySelectorAll('[data-typewriter-step]')],choice=canvas.querySelector('[data-typewriter-choice]');check('Clinical choices initially empty',steps.every(e=>w.getComputedStyle(e).opacity==='0')&&!choice.classList.contains('is-selected'));for(let i=0;i<steps.length;i++){await until(()=>steps[i].classList.contains('is-complete'));check(`Clinical step ${i+1} ordered`,steps.slice(0,i+1).every(e=>e.classList.contains('is-complete'))&&!choice.classList.contains('is-selected'))}await until(()=>choice.classList.contains('is-selected'));check('Clinical choice has bounce before action',w.getComputedStyle(choice.querySelector('.oxford-demo_radio-selected')).animationName==='oxford-choice-bounce'&&!action.classList.contains('is-revealed'));await until(()=>action.classList.contains('is-revealed'))}
   if(index===4){const steps=[...canvas.querySelectorAll('[data-sequence-item]')];for(let i=0;i<steps.length;i++){await until(()=>steps[i].classList.contains('is-visible'));check(`Reflection step ${i+1} ordered`,steps.slice(0,i+1).every(e=>e.classList.contains('is-visible'))&&steps.slice(i+1).every(e=>!e.classList.contains('is-visible'))&&!action.classList.contains('is-revealed'))}await until(()=>action.classList.contains('is-revealed'))}
   const completed=performance.now();w.getComputedStyle(action).opacity;action.getAnimations().forEach(animation=>animation.finish());check(`Tab ${index+1} action visible end state`,w.getComputedStyle(action).opacity==='1');
   await wait(3300);check(`Tab ${index+1} holds completed result`,card.classList.contains('is-card-visible')&&action.classList.contains('is-revealed'));
   await until(()=>!card.classList.contains('is-card-visible'));check(`Tab ${index+1} 4s hold then disappearance`,performance.now()-completed>=4000);await until(()=>card.classList.contains('is-card-visible'));check(`Tab ${index+1} new cycle clears action`,!action.classList.contains('is-revealed'));
 }
 buttons[2].click();const sequence=panels[2].querySelector('academy-demo-sequence'),cards=[...sequence.querySelectorAll('[data-sequence-item]')];sequence.scrollIntoView({block:'center'});await wait(150);check('Cases start promptly',cards[1].classList.contains('is-visible')&&!cards[0].classList.contains('is-visible')&&!cards[2].classList.contains('is-visible'));
 for(const [position,index] of [1,0,2].entries()){await until(()=>cards[index].classList.contains('is-visible'));check(`Case order ${position+1}: ${index}`,cards.filter(e=>e.classList.contains('is-visible')).length===position+1&&cards[index].classList.contains('is-emphasized'));w.getComputedStyle(cards[index]).transform;cards[index].getAnimations().forEach(animation=>animation.finish());check(`Case ${index+1} scale/shadow end state`,w.getComputedStyle(cards[index]).transform.includes('1.04')&&w.getComputedStyle(cards[index]).boxShadow!=='none')}
 await until(()=>cards.every(e=>!e.classList.contains('is-visible')));check('Cases disappear together',true);await until(()=>cards[1].classList.contains('is-visible'));check('Cases restart from middle',!cards[0].classList.contains('is-visible')&&!cards[2].classList.contains('is-visible'));
 w.scrollTo({top:0,behavior:'instant'});await until(()=>cards.every(e=>!e.classList.contains('is-visible')),5000);await wait(800);check('Viewport exit clears active sequence',cards.every(e=>!e.classList.contains('is-visible')));buttons[0].click();check('Inactive sequence stopped',cards.every(e=>!e.classList.contains('is-visible')));
 const parent=tabs.parentNode,next=tabs.nextSibling;tabs.remove();parent.insertBefore(tabs,next);check('Tabs reconnect',tabs.classList.contains('is-enhanced')&&tabs.querySelectorAll('[role=tab]').length===5);
 const second=tabs.cloneNode(true);second.querySelectorAll('[id]').forEach(e=>e.id='second-'+e.id);parent.append(second);second.querySelectorAll('[data-tabs-trigger]')[3].click();check('Two tab instances independent',tabs.querySelector('[aria-selected=true]').dataset.tabsTrigger!==second.querySelector('[aria-selected=true]').dataset.tabsTrigger);second.remove();
 const teachers=d.querySelector('academy-teachers');const names=[...teachers.querySelectorAll('[data-js=teacher-tab]')];names[9].click();await wait(500);check('Teacher last card selection',names[9].getAttribute('aria-selected')==='true');names[9].dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true}));await wait(450);check('Teacher keyboard Home',names[0].getAttribute('aria-selected')==='true');
 const allPhotos=[...teachers.querySelectorAll('img')];allPhotos.forEach(i=>i.loading='eager');await Promise.all(allPhotos.map(i=>i.decode().catch(()=>{})));check('All ten teacher photos load',allPhotos.length===10&&allPhotos.every(i=>i.naturalWidth>0),allPhotos.map(i=>({name:i.alt,width:i.naturalWidth,height:i.naturalHeight})));
 const storyNames=['Тамара Карькова','Дана Качура','Ксения Вакорина','Елизавета Вакула','Валерия Чуприянова'];
 const storyCards=[...d.querySelectorAll('.practice-stories_item')],smallCardHeading=d.querySelector('#recognition .content-heading_component.is-card'),storySticky=d.querySelector('.practice-stories_sticky');
 check('Story names and heading semantics',storyCards.length===storyNames.length&&storyCards.every((card,index)=>card.querySelector('h3.review-card_name')?.textContent===storyNames[index]));
 for(const width of [375,520,521,767,768,1024,1025,1440]){f.width=width;await wait(80);const tabStyle=w.getComputedStyle(buttons[0]),teacherStyle=w.getComputedStyle(names[0]),storyNameStyle=w.getComputedStyle(storyCards[0].querySelector('.review-card_name')),smallHeadingStyle=w.getComputedStyle(smallCardHeading),storyCopyStyle=w.getComputedStyle(storyCards[0].querySelector('.review-card_copy')),captionStyle=w.getComputedStyle(storyCards[0].querySelector('.review-card_caption')),expectedStoryGap=width<768?8:12,expectedStoryTop=width<=520?60:width<768?80:100;check(`Shared tab metrics ${width}`,tabStyle.fontSize===teacherStyle.fontSize&&tabStyle.lineHeight===teacherStyle.lineHeight&&tabStyle.padding===teacherStyle.padding&&tabStyle.minHeight==='auto');check(`Story name typography ${width}`,storyNameStyle.fontFamily===smallHeadingStyle.fontFamily&&storyNameStyle.fontSize===smallHeadingStyle.fontSize&&storyNameStyle.fontWeight===smallHeadingStyle.fontWeight&&storyNameStyle.lineHeight===smallHeadingStyle.lineHeight&&storyNameStyle.color===captionStyle.color);check(`Story name gap ${width}`,parseFloat(storyCopyStyle.rowGap)===expectedStoryGap,storyCopyStyle.rowGap);check(`Story top inset ${width}`,parseFloat(w.getComputedStyle(storySticky).paddingTop)===expectedStoryTop,w.getComputedStyle(storySticky).paddingTop);for(let i=0;i<buttons.length;i++){buttons[i].click();await wait(20);const visible=[...panels[i].querySelectorAll('.oxford-demo_note,.oxford-demo_case,.showcase-tabs_copy')];check(`Layout ${width} tab ${i+1}`,d.documentElement.scrollWidth===width&&visible.every(e=>e.scrollWidth<=e.clientWidth+1))}}
 const nojs=await frame('nojs'),nd=nojs.contentDocument;check('No JS shows all tabs, teachers and stages',nd.querySelectorAll('[data-tabs-panel]:not([hidden])').length===5&&[...nd.querySelectorAll('.teacher-card_component,.stage-card_description')].every(e=>e.getBoundingClientRect().height>0));
 const reduced=await frame('reduced'),rd=reduced.contentDocument;rd.querySelector('academy-showcase-tabs').scrollIntoView();await wait(500);check('Reduced motion keeps full text',!rd.querySelector('academy-typewriter').classList.contains('is-playing')&&rd.querySelector('[data-typewriter-text]').getBoundingClientRect().height>0);
 check('No JS keeps action visible',nojs.contentWindow.getComputedStyle(nd.querySelector('[data-typewriter-reveal]')).opacity==='1');
 check('Reduced motion keeps action visible',reduced.contentWindow.getComputedStyle(rd.querySelector('[data-typewriter-reveal]')).opacity==='1');
 check('Reduced motion keeps cases static',!rd.querySelector('academy-demo-sequence .is-emphasized'));
 check('Complete',true);const failures=results.filter(result=>!result.pass);document.title=failures.length?`КПТ — FAIL: ${failures.map(result=>result.name).join(', ')}`:'КПТ — проверка компонентов: PASS';
} catch(error){check('Exception',false,error.stack);document.title='КПТ — проверка компонентов: FAIL'}
</script></html>
