        {
          "@type": "Question",
          "name": "В чем различия моделей А. Бека и Оксфордской модели?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Концептуализация в когнитивно-поведенческой терапии — это «карта клиента», которая помогает понять внутренние механизмы симптомов, триггеры и причины обращения. Это живой инструмент, на основе которого строится план терапии и формулируются конкретные цели.\n\nКонцептуализация Бека более компактная, она описывает связь прошлого опыта и актуальных убеждений клиента о себе, мире и других людях, а также их влияния на поведение и эмоций. Эта концептуализация является классической и широко известной, акцент делается на когнитивных убеждениях и копингах клиента.\n\nОксфордская концептуализация — более детальная и расширенная версия концептуализация Бека, она включает дополнительные блоки: биологические факторы, модифицирующие и защитные факторы, а также четко выделенные триггеры, проблемы и цели клиента, а также критическое событие, ставшее причиной обращения."
          }
        },
        {
          "@type": "Question",
          "name": "Чем отличаются обучающие программы по КПТ двух моделей?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Программы различаются акцентами:\n\nВ программе, где основной является оксфордская концептуализация, упор идёт на углублённое изучение конкретных нозологий и протоколов работы с ними, рассматривается возникновение ментальных расстройств, их предпосылки, а также как с ними работать с помощью когнитивно-поведенческого подхода.\n\nВ программе, где основой является концептуализация Бека, мы больше делаем акцент на изучение самого метода, кругозор КПТ-терапевта, рассматриваем взаимосвязи КПТ с другими подходами, а также изучаем большее количество нозологий, но базово, не углубляясь в подробное изучение каждой."
          }
        },
        {
          "@type": "Question",
          "name": "Какую программу КПТ мне лучше выбрать?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Вы можете выбрать любую программу, здесь есть различие в том, что для вас в фокусе профессионального развития. В организации обучения программы идентичны и включают: записанные лекции на платформе, два практических дня занятия с преподавателем, а также учебные семьи.\n\nРазличие есть в формах аттестации, подробнее о которых вам расскажет наш менеджер. Также различия есть в содержании третьего, четвёртого и пятого блоков.\n\nНа программе с Оксфордской концептуализацией больше клинического взгляда и акцента на работу с конкретными нозологиями (РПП, БАР, ОКР, тревожное и паническое расстройство), в программе с концептуализацией Бека больше связей с другими подходами и рассмотрены больше нозологий, но более обзорно."
          }
        },
        {
          "@type": "Question",
          "name": "Это живые лекции или все в записи?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Преподаватель проводит вебинар на платформе Zoom. Там вы сможете задать вопросы в режиме реального времени. Практика тоже проходит в режиме онлайн, со включёнными камерой и микрофоном."
          }
        },
        {
          "@type": "Question",
          "name": "Кому я смогу задать вопросы о процессе обучения?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "За каждым курсом закреплён куратор. Вы можете задать все вопросы ему."
          }
        },
        {
          "@type": "Question",
          "name": "Вы заключаете договор со студентами?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Оказание услуг на образовательную деятельность осуществляется по договору оферты. В индивидуальных случаях мы можем предложить формирование договора для студента лично. Однако оба этих договора имеют одинаковую юридическую силу."
          }
        },
        {
          "@type": "Question",
          "name": "У вас есть лицензия на обучение?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Наша лицензия на осуществление образовательной деятельности: Л035–01271–78/00176689, Распоряжение от 31.03.2022 № 631-р"
          }
        },
        {
          "@type": "Question",
          "name": "Я смогу вернуть деньги за курс, если мне не понравится?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Можно вернуть деньги за непройденный материал. Однако, в этом случае вы не сможете получить документ о повышении квалификации или профессиональной переподготовке"
          }
        },
        {
          "@type": "Question",
          "name": "Можно перевестись на другой курс, если я передумаю?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Перевод на другой курс возможен только на старте обучения и при условии соответствия всем требованиям для зачисления на другую программу. В этом случае вам будет пересчитана стоимость обучения."
          }
        },
        {
          "@type": "Question",
          "name": "Что нужно выполнить на курсе, чтобы получить диплом?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Условием получения диплома является посещение более 80% занятий с включенной камерой и активным участием, а также сдача промежуточной и итоговой аттестации."
          }
        },
        {
          "@type": "Question",
          "name": "Какая реальная нагрузка будет на курсе?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "На курсе предусмотрены практические занятия два раза в неделю, также каждую неделю вам открывается несколько лекций для просмотра в удобное для вас время, также после некоторого времени обучения для вас откроется формат учебных семей, где вы также сможете самостоятельно регулировать время своих встреч с командой для выполнения заданий.\n\nТакже на курсе предусмотрены всего три контрольные точки на выполнение которых дается две недели, такого времени достаточно, чтобы четко выполнить предложенные задания."
          }
        },
        {
          "@type": "Question",
          "name": "Достаточно ли времени, чтобы изучить все нозологии или программа предполагает, что у студентов уже есть эта клиническая база?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Программа рассчитана на то, чтобы дать вам базу с нуля или систематизировать разрозненные знания. 750 академических часов — это полноценный объем профессиональной переподготовки это время планомерно распределено на глубокое погружение в каждую нозологию."
          }
        }
      ]
    },
