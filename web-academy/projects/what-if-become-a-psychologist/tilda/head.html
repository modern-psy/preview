  transform: translate(-50%, -50%);
}

.cta_grid-image,

.cta_grid-highlights,

.cta_comet-layer {
  position: absolute;

.cta_grid-cross {
  --cta-cross-size: 0.625rem;
  position: absolute;
  top: calc(var(--cta-cross-y) - (var(--cta-cross-size) / 2));
  left: calc(var(--cta-cross-x) - (var(--cta-cross-size) / 2));
  width: var(--cta-cross-size);
  height: var(--cta-cross-size);
}

.cta_grid-cross::before,
.cta_grid-cross::after {
  position: absolute;
  top: 50%;
  left: 50%;
  background: #949494;
  border-radius: 999px;
  content: "";
  transform: translate(-50%, -50%);
}

.cta_grid-cross::before {
  width: 100%;
  height: 0.5px;
}

.cta_grid-cross::after {
  width: 0.5px;
  height: 100%;
}

.interactive-grid_cell {
  position: absolute;
  top: var(--grid-cell-y);
