<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video review checks</title>
<link rel="stylesheet" href="../../../shared/academy/components.css?v=video-3"><link rel="stylesheet" href="../../../shared/academy/review-controls.css?v=video-3"><link rel="stylesheet" href="../../../shared/academy/review-card.css?v=video-3">
<link rel="stylesheet" href="../styles.css"><script src="../../../shared/academy/review-card.js?v=video-3" defer></script>
<body><main class="academy-page psychologist-consultant-page"><button id="run" type="button">Проверить видео</button><output id="results">Готово к проверке</output><div data-slider-component style="display:flex;gap:1rem;max-width:48rem"><academy-review class="review-card_component" data-review-video-card style="--review-image-position:center 20%"><div class="review-card_media"><video class="review-card_image" id="video-fixture-video-media" data-review-video src="https://static.tildacdn.com/vide3762-6466-4663-a435-656633336531/valentina-testimonia.mp4" poster="../assets/images/review-video-placeholder.webp" preload="none" playsinline controls aria-label="Видеоотзыв студентки" data-slider-no-drag></video><img class="review-card_image review-card_poster" data-review-video-poster hidden src="../assets/images/review-video-placeholder.webp" width="507" height="900" alt="" draggable="false" loading="lazy"><button class="review-control_component review-card_play" type="button" data-review-video-toggle aria-controls="video-fixture-video-media" aria-label="Воспроизвести видеоотзыв" hidden><span class="review-card_play-glyph" aria-hidden="true"><img class="review-card_play-icon" src="../assets/icons/review-play.svg" width="22" height="22" alt="" draggable="false"></span><span class="review-card_pause-glyph" aria-hidden="true"><img class="review-card_play-icon" src="../assets/icons/review-pause.svg" width="22" height="22" alt="" draggable="false"></span></button><p class="review-card_status" data-review-video-status role="status" hidden></p></div><p class="review-card_caption">Любой преподаватель готов был ответить на&nbsp;твои вопросы, <span class="review-card_caption-muted">любой был готов подсказать, помочь, поддержать и&nbsp;это очень ценно и&nbsp;важно.</span></p></academy-review><academy-review class="review-card_component" data-review-video-card style="--review-image-position:center 20%"><div class="review-card_media"><video class="review-card_image" id="second-video-fixture-video-elena-media" data-review-video src="https://static.tildacdn.com/vide3464-3961-4361-a538-356536646661/elena-testimonial-UU.mp4" poster="https://optim.tildacdn.com/tild3139-3364-4637-a537-343530363639/-/format/webp/Frame_584.jpg.webp" preload="none" playsinline controls aria-label="Видеоотзыв студентки" data-slider-no-drag></video><img class="review-card_image review-card_poster" data-review-video-poster hidden src="https://optim.tildacdn.com/tild3139-3364-4637-a537-343530363639/-/format/webp/Frame_584.jpg.webp" width="507" height="900" alt="" draggable="false" loading="lazy"><button class="review-control_component review-card_play" type="button" data-review-video-toggle aria-controls="second-video-fixture-video-elena-media" aria-label="Воспроизвести видеоотзыв" hidden><span class="review-card_play-glyph" aria-hidden="true"><img class="review-card_play-icon" src="../assets/icons/review-play.svg" width="22" height="22" alt="" draggable="false"></span><span class="review-card_pause-glyph" aria-hidden="true"><img class="review-card_play-icon" src="../assets/icons/review-pause.svg" width="22" height="22" alt="" draggable="false"></span></button><p class="review-card_status" data-review-video-status role="status" hidden></p></div><p class="review-card_caption">Сравнила несколько школ <span class="review-card_caption-muted">и&nbsp;выбрала Академию</span></p></academy-review></div></main>
<script>
document.querySelector('#run').addEventListener('click', async () => {
 const results = [], output = document.querySelector('#results');
 const check = (ok, label) => { if (!ok) throw Error(label); results.push('PASS '+label); output.textContent = results.join(' | '); };
 const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
 const until = async fn => { for(let i=0;i<100;i++){if(fn())return; await wait(100);} throw Error('Media wait timed out'); };
 const card = document.querySelector('[data-review-video-card]'), video = card.querySelector('video'), button = card.querySelector('button');
 try {
  check(video.paused && !video.controls && !button.hidden, 'initial state: no autoplay, custom control ready');
  button.click(); await until(() => video.currentTime > .1);
  check(!video.paused && button.hasAttribute('data-playing'), 'play advances real media and displays pause');
  button.click(); await wait(100); const time = video.currentTime; await wait(200);
  check(video.paused && video.currentTime === time && !button.hasAttribute('data-playing'), 'pause holds the current frame');
  const poster = card.querySelector('[data-review-video-poster]');
  check(poster.hidden, 'poster stays hidden immediately after pause');
  await wait(2400);
  check(!poster.hidden && video.currentTime === time, 'poster returns after 2.5 seconds without resetting time');
  button.click(); await until(() => video.currentTime > time + .1);
  check(poster.hidden, 'resume hides the poster');
  button.click(); await wait(100); button.click(); await wait(2600);
  check(poster.hidden && !video.paused, 'early resume cancels the pending poster timer');
  check(!video.paused, 'resume continues from the paused position');
  const parent = card.parentElement; card.remove();
  check(video.paused && video.controls && button.hidden, 'disconnect stops media and restores native controls');
  parent.append(card); await wait(100); button.click(); await until(() => !video.paused && video.currentTime > time + .2);
  check(!video.controls && !button.hidden, 'reconnect creates one working control');
  button.click(); await wait(50);
  const script = document.createElement('script'); script.src = '../../../shared/academy/review-card.js?v=video-3';
  const loaded = new Promise(resolve => script.onload=resolve); document.body.append(script); await loaded;
  button.click(); await until(() => !video.paused && button.hasAttribute('data-playing'));
  check(button.hasAttribute('data-playing'), 'duplicate runtime does not double-toggle');
  video.currentTime = video.duration - .1; await until(() => video.ended); await wait(50);
  check(!button.hasAttribute('data-playing'), 'ended resets the play control');
  button.click(); await until(() => !video.paused && video.currentTime < 2);
  check(!video.ended, 'play after ending restarts the video');
  button.click(); await wait(50);
  video.src = 'data:video/mp4;base64,AAAA'; button.click(); await until(() => !card.querySelector('[role="status"]').hidden);
  check(video.paused && !button.hasAttribute('data-playing'), 'invalid media reports an error and resets control');
  video.src = "https://static.tildacdn.com/vide3762-6466-4663-a435-656633336531/valentina-testimonia.mp4"; video.load(); button.click(); await until(() => !video.paused && video.currentTime > .1);
  check(card.querySelector('[role="status"]').hidden, 'retry recovers after a failed source');
  const second = document.querySelectorAll('[data-review-video-card]')[0];
  const other = second === card ? document.querySelectorAll('[data-review-video-card]')[1] : second;
  other.querySelector('button').click(); await until(() => other.querySelector('video').currentTime > .1);
  check(video.paused && !button.hasAttribute('data-playing'), 'starting the other review pauses previous media');
  other.querySelector('button').click();
 } catch(error) { results.push('FAIL '+error.message); video.pause(); }
 output.textContent = results.join(' | ');
});
</script></body></html>
