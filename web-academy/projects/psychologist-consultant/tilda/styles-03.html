.section-title_accent {
  display: inline;
  color: var(--color-accent-text, var(--color-accent-primary));
}

.section-subtitle_component {
  width: 100%;
  min-width: 0;
  margin: 0;
  color: var(--section-subtitle-color, var(--color-text-secondary-large));
  font-family: var(--font-family-body);
  font-size: var(--section-heading-description-size);
  font-weight: 400;
  line-height: var(--section-subtitle-line-height, 1.2);
  letter-spacing: var(--section-subtitle-tracking, -0.01em);
  text-wrap: pretty;
}

.content-heading_component {
  min-width: 0;
  margin: 0;
  color: inherit;
  font-family: var(--font-family-body);
  font-size: var(--content-heading-size, clamp(1.25rem, 2.419vw, 1.5rem));
  font-weight: 500;
  line-height: var(--content-heading-line-height, 1.1);
  letter-spacing: 0;
  font-feature-settings: "lnum" 1, "pnum" 1;
}

.content-heading_component.is-prominent {
  font-size: var(--content-prominent-size, clamp(1.75rem, 2.4vw, 2.25rem));
  font-weight: 444;
  letter-spacing: -0.03em;
}

/* One portrait heading size for the standard card families. */
@media (max-width: 32.5rem) {
  .card_component.is-icon-statement,
  .card_component.is-stage { --content-heading-size: 1.25rem; }
  .card_component.benefits_card { --hero-card-title-size: 1.25rem; }
}

/* Shared card/question heading role; independent of its surrounding surface. */
.content-heading_component.is-card { --content-heading-size: 1.25rem; }
.content-heading_component.is-profile { --content-heading-size: 1.375rem; font-weight: 400; }
@media (min-width: 32.5625rem) {
  .content-heading_component.is-card { --content-heading-size: 1.375rem; }
  .content-heading_component.is-profile { --content-heading-size: 1.5rem; }
}
@media (min-width: 48rem) {
  .content-heading_component.is-card { --content-heading-size: 1.5rem; }
  .content-heading_component.is-profile { --content-heading-size: 1.75rem; }
}
@media (min-width: 64.0625rem) {
  .content-heading_component.is-profile { --content-heading-size: 2rem; }
}

.content-header_component {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: var(--content-heading-gap);
}

.section-header_component {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
  gap: var(--section-heading-gap);
}

/* Separate the heading-to-copy distance from gaps inside a copy group. */
.section-subtitles_component {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
  gap: var(--section-subtitles-gap, 1rem);
}
.section-header_title {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
  align-items: inherit;
  gap: var(--section-heading-mark-gap, 1rem);
}
.section-header_component.is-responsive {
  --section-heading-gap: var(--space-heading-copy);
  --section-heading-description-size: 1rem;
  --section-subtitles-gap: var(--space-subtitle-pair);
  --section-heading-mark-gap: var(--space-mark-heading);
}
@media (min-width: 32.5625rem) {
  .section-header_component.is-responsive { --section-heading-description-size: 1.125rem; }
}
@media (min-width: 48rem) {
  .section-header_component.is-responsive { --section-heading-description-size: 1.25rem; }
}
@media (min-width: 64.0625rem) {
  .section-header_component.is-responsive { --section-heading-description-size: 1.375rem; }
}

.section-header_component.is-left {
  align-items: flex-start;
  text-align: left;
}

.section-header_component.is-center {
  align-items: center;
  text-align: center;
}

.section-header_component.is-right {
  align-items: flex-end;
  text-align: right;
}

.section-layout_component {
  display: flex;
  width: 100%;
  min-width: 0;
  flex-direction: column;
  gap: var(--section-layout-gap, clamp(2.5rem, 6.835vw, 4.375rem));
}
.section-layout_component.is-responsive {
  --section-title-size: 2rem;
  --section-title-line-height: 1;
  --section-layout-gap: var(--space-section-content);
}
@media (min-width: 32.5625rem) {
  .section-layout_component.is-responsive { --section-title-size: 2.25rem; }
}
@media (min-width: 48rem) {
  .section-layout_component.is-responsive { --section-title-size: 2.75rem; }
}
@media (min-width: 64.0625rem) {
  .section-layout_component.is-responsive { --section-title-size: 3.25rem; }
}

@media (min-width: 64.0625rem) {
  .section-layout_component.is-split {
    display: grid;
    grid-template-columns: var(--section-layout-columns, minmax(0, 0.75fr) minmax(0, 1fr));
    align-items: start;
  }
}
