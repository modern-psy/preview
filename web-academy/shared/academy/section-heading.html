<!-- Inside .academy-page; load components.css and then section-heading.css.
     Replace placeholders. The surrounding section owns widths, copy and IDs. -->
<section class="section-layout_component" aria-labelledby="{{heading-id}}">
  <div class="section-header_component is-center">
    <h2 class="section-title_component is-center" id="{{heading-id}}">{{heading}}</h2>
    <p class="section-subtitle_component">{{subtitle}}</p>
  </div>
  <ul class="card-grid_component">
    <li class="card_component">
      <div class="content-header_component">
        <h3 class="content-heading_component">{{card-heading}}</h3>
        <p class="card_description">{{card-description}}</p>
      </div>
    </li>
  </ul>
</section>
