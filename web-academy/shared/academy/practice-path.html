<section class="section_practice-path section-spacing_component" id="{{id}}" aria-labelledby="{{id}}-heading">
        <div class="padding-global">
          <div class="container-xlarge">
            <div class="practice-path_component section-layout_component is-responsive">
              <div class="section-header_component is-center practice-path_intro">
                <h2 class="section-title_component is-center" id="{{id}}-heading">{{heading}}</h2>
              </div>
              <div class="practice-path_layout">
                <ul class="practice-path_list" aria-label="Путь к самостоятельной практике">
                  <li class="card_component practice-path_card">
                    <p class="body-text_component is-statement">{{firstStatement}}</p>
                    <div class="practice-path_call" aria-hidden="true">
                      <img class="practice-path_call-image" src="{{callImage}}" width="800" height="584" alt="" draggable="false" loading="lazy" decoding="async">
                      <div class="practice-path_call-bar">
                        <span class="practice-path_call-indicator"><img class="practice-path_call-icon" src="{{microphoneIcon}}" width="20" height="20" alt="" draggable="false" loading="lazy"></span>
                        <span class="practice-path_call-indicator"><img class="practice-path_call-icon" src="{{videoIcon}}" width="20" height="20" alt="" draggable="false" loading="lazy"></span>
                        <span class="practice-path_call-indicator is-end"><img class="practice-path_call-icon is-small" src="{{phoneIcon}}" width="16" height="16" alt="" draggable="false" loading="lazy"></span>
                      </div>
                    </div>
                  </li>
                  <li class="card_component practice-path_card">
                    <p class="body-text_component is-statement">{{secondStatement}}</p>
                    <div class="practice-path_diploma" aria-hidden="true">
                      <img class="practice-path_diploma-image" src="{{diplomaImage}}" width="800" height="976" alt="" draggable="false" loading="lazy" decoding="async">
                    </div>
                  </li>
                </ul>
                <article class="card_component practice-path_format" aria-labelledby="{{id}}-format-heading">
                  <div class="practice-path_format-copy content-header_component">
                    <h3 class="content-heading_component is-prominent" id="{{id}}-format-heading">{{formatHeading}}</h3>
                    <p class="practice-path_format-description">{{formatDescription}}</p>
                  </div>
                  <img class="practice-path_format-image" src="{{formatImage}}" width="1116" height="836" alt="" aria-hidden="true" draggable="false" loading="lazy" decoding="async">
                  <button class="cta_button button_component is-light practice-path_button" type="button" aria-disabled="true" data-action="{{action}}">{{button}}</button>
                </article>
              </div>
            </div>
          </div>
        </div>
      </section>
