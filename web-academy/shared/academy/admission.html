<!-- Inside .academy-page; load components.css, card-spacing.css, admission.css, then section-heading.css.
     Prefer renderAdmission(data, {id}) for the complete generated composition.
     Replace all {{...}} values with consumer-owned IDs, copy and image URLs. -->
<section aria-labelledby="{{heading-id}}">
  <div class="admission_component section-layout_component is-responsive">
    <div class="admission_intro section-header_component">
      <h2 class="section-title_component" id="{{heading-id}}">{{heading}}</h2>
    </div>
    <ul class="admission_documents">
      <li class="card_component admission_card">
        <h3 class="content-heading_component is-card">{{first-document}}</h3>
        <span class="card_icon is-document" aria-hidden="true">
          <img src="{{first-icon-url}}" width="20" height="20" alt="" draggable="false" loading="lazy">
        </span>
      </li>
      <li class="card_component admission_card">
        <h3 class="content-heading_component is-card">{{second-document}}</h3>
        <span class="card_icon is-document" aria-hidden="true">
          <img src="{{second-icon-url}}" width="20" height="20" alt="" draggable="false" loading="lazy">
        </span>
      </li>
      <li class="card_component admission_card is-diploma">
        <h3 class="content-heading_component is-card admission_diploma-heading">{{education-document}}</h3>
        <img class="admission_diploma" src="{{diploma-url}}" width="201" height="142" alt="" draggable="false" loading="lazy">
      </li>
    </ul>
  </div>
</section>
