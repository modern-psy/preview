    <!-- Стенд: настоящая разметка из request-form-render.mjs, скрипт request-form.js
         и поддельная нативная форма Тильды. Никуда ничего не отправляет.
         Параметры адреса:
           mode=course|waitlist|access|webinar   режим формы
           messenger=telegram|max            что выбрать перед автопроверкой
           event=success|error|captcha|validation|missing|unrelated   ответ «Тильды»
           email=required                    в нативной форме почта обязательна (проверка контракта)
           mask=own                          без маски Тильды: проверка запасной маски
           auto=1                            сразу заполнить и отправить -->
    <div class="fixture_bar">
      <button id="run" type="button" disabled>Заполнить и отправить</button>
      <a href="?mode=course">Курс</a>
      <a href="?mode=course&amp;messenger=max">Курс, MAX</a>
      <a href="?mode=waitlist">Лист ожидания</a>
      <a href="?mode=access">Доступ</a>
      <a href="?mode=webinar">Вебинар</a>
      <a href="?mode=course&amp;event=error">Ошибка Тильды</a>
      <a href="?mode=course&amp;event=missing">Нет нативной формы</a>
      <pre class="fixture_result" id="result">Загрузка…</pre>
    </div>
    <main class="academy-page">
      <div id="stage"></div>
    </main>

    <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const mode = ['course', 'waitlist', 'access', 'webinar'].includes(params.get('mode')) ? params.get('mode') : 'course';
      const event = params.get('event') || 'success';
      const result = document.querySelector('#result');
      let submitCount = 0;

      // Разметку заранее собирает build-request-form-fixture.mjs из request-form-render.mjs
      document.querySelector('#stage').append(document.querySelector(`#request-form-markup-${mode}`).content.cloneNode(true));

      // Поддельная нативная форма Тильды: структура как в опубликованном блоке
      const record = document.createElement('section');
      record.className = 't-rec';
      const emailReq = params.get('email') === 'required' ? ' data-tilda-req="1"' : '';
      const messengerBlock = mode === 'access' ? '' : `
        <div class="t-input-group t-input-group_contact_method" data-field-name="messenger-type;messenger-id">
          <input type="radio" name="messenger-type" value="whatsapp" checked>
          <input type="radio" name="messenger-type" value="telegram">
          <div class="t-contact-method__telegram-value t-phonemask-input-group t-contact-method__hybrid t-contact-method__hidden">
            <input class="js-phonemask-result-iso" type="hidden" name="tildaspec-phone-part[]-iso" disabled>
            <input class="t-input t-input-phonemask" type="tel" name="tildaspec-phone-part[]" disabled>
            <input class="js-phonemask-result js-tilda-rule" type="hidden" name="messenger-id" disabled>
            <input class="t-input js-username-input js-tilda-rule" type="text" name="messenger-id" disabled>
          </div>
          <div class="t-contact-method__whatsapp-value t-phonemask-input-group">
            <input class="js-phonemask-result-iso" type="hidden" name="tildaspec-phone-part[]-iso">
            <input class="t-input t-input-phonemask" type="tel" name="tildaspec-phone-part[]" data-phonemask-code="+7" data-phonemask-iso="ru">
            <input class="js-phonemask-result js-tilda-rule" type="hidden" name="messenger-id" data-tilda-rule="phone">
          </div>
        </div>`;
      record.innerHTML = `
        <form class="t-form">
          <input type="hidden" name="tildaspec-formname" value="fixture-form">
          <input type="text" name="Name" data-tilda-rule="name" data-tilda-req="1">
          <input type="email" name="email" data-tilda-rule="email"${emailReq}>
          <div class="t-input-group t-input-group_ph" data-field-name="Phone">
            <input class="js-phonemask-result-iso" type="hidden" name="tildaspec-phone-part[]-iso">
            <input class="t-input t-input-phonemask" type="tel" name="tildaspec-phone-part[]" data-phonemask-code="+7" data-phonemask-iso="ru">
            <input class="js-phonemask-result js-tilda-rule" type="hidden" name="Phone" data-tilda-rule="phone" data-tilda-rule-minlength="18">
          </div>
          ${messengerBlock}
          <button type="submit">Отправить</button>
        </form>`;
      const nativeForm = record.querySelector('form');
      const messengerGroup = nativeForm.querySelector('.t-input-group_contact_method');
      if (messengerGroup) {
        const telegramFields = messengerGroup.querySelector('.t-contact-method__telegram-value');
        const maxFields = messengerGroup.querySelector('.t-contact-method__whatsapp-value');
        const renderNativeMessenger = () => {
          const isTelegram = messengerGroup.querySelector('input[name="messenger-type"]:checked')?.value === 'telegram';
          telegramFields.classList.toggle('t-contact-method__hidden', !isTelegram);
          maxFields.classList.toggle('t-contact-method__hidden', isTelegram);
          telegramFields.querySelectorAll('input').forEach(input => { input.disabled = !isTelegram || !(input.name === 'messenger-id' && input.type === 'text'); });
          maxFields.querySelectorAll('input').forEach(input => { input.disabled = isTelegram; });
        };
        messengerGroup.querySelectorAll('input[name="messenger-type"]').forEach(input => input.addEventListener('change', renderNativeMessenger));
        renderNativeMessenger();
      }
      // Нативная форма-заглушка не инициализирована настоящей маской Тильды,
      // поэтому её поле телефона заполняем упрощённо: +7 (912) 345-67-89
      const stubSetValue = (group, phone) => {
        const digits = String(phone).replace(/\D/g, '');
        const national = digits.startsWith('7') ? digits.slice(1, 11) : digits;
        const formatted = national.replace(/^(\d{3})(\d{3})(\d{2})(\d{2})$/, '($1) $2-$3-$4');
        const visible = group.querySelector('input.t-input-phonemask:not([type="hidden"])');
        visible.value = formatted;
        Object.assign(visible.dataset, {phonemaskCode: '+7', phonemaskCurrent: formatted, phonemaskIso: 'ru'});
        group.querySelectorAll('.js-phonemask-result').forEach(input => { input.value = `+7 ${formatted}`; });
        group.querySelectorAll('.js-phonemask-result-iso').forEach(input => { input.value = 'ru'; });
      };
      nativeForm.addEventListener('submit', submitEvent => {
        submitEvent.preventDefault();
        submitCount += 1;
        const value = name => nativeForm.querySelector(`input[name="${name}"]`)?.value ?? null;
        const activeContact = nativeForm.querySelector('input[name="messenger-id"]:not(:disabled):not([type="hidden"]), .t-contact-method__whatsapp-value:not(.t-contact-method__hidden) input[name="messenger-id"]');
        const inactive = messengerGroup ? [...messengerGroup.querySelectorAll('input[name="messenger-id"]:disabled, input[name="tildaspec-phone-part[]"]:disabled')].map(input => input.value).filter(Boolean) : [];
        window.__requestFormFixture = {
          Name: value('Name'), email: value('email'), Phone: value('Phone'),
          messengerType: nativeForm.querySelector('input[name="messenger-type"]:checked')?.value ?? null,
          messengerId: activeContact?.value ?? null,
          form_source: value('form_source'), fixture_device: value('fixture_device'),
          inactiveContactValues: inactive,
        };
        if (event === 'validation') {
          nativeForm.querySelector('.t-input-group_ph').classList.add('js-error-control-box');
          return;
        }
        setTimeout(() => {
          window.__fixtureEventDispatched = true;
          if (event === 'captcha') return;
          const type = event === 'error' ? 'tildaform:aftererror' : 'tildaform:aftersuccess';
          const form = event === 'unrelated' ? document.createElement('form') : nativeForm;
          document.dispatchEvent(new CustomEvent(type, {detail: {form}}));
        }, 300);
      });
      if (event !== 'missing') document.body.append(record);

      const loadScript = src => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.append(script);
      });
      if (params.get('mask') === 'own') {
        // Скрипт формы найдёт «уже подключённую» маску и не станет грузить настоящую
        await loadScript('data:text/javascript,// tilda-phone-mask (заглушка стенда)');
      } else {
        await loadScript('https://static.tildacdn.com/js/tilda-phone-mask-1.1.min.js').catch(() => {});
      }
      // Видимое поле работает с настоящей маской Тильды, нативная заглушка — с упрощённой
      const realSetValue = window.t_form_phonemask__setValue;
      window.t_form_phonemask__setValue = (group, phone, iso, options) =>
        group.closest('.t-form') || typeof realSetValue !== 'function' ? stubSetValue(group, phone) : realSetValue(group, phone, iso, options);
      await loadScript('../request-form.js');
      // Маска Тильды подключается асинхронно: ждём, пока поле телефона заменится
      for (let i = 0; i < 20 && params.get('mask') !== 'own' && typeof realSetValue === 'function' && !document.querySelector('.request-form_component input.t-input-phonemask'); i++) {
        await new Promise(resolve => setTimeout(resolve, 50));
      }

      const form = document.querySelector('[data-academy-request-form]');
      const runButton = document.querySelector('#run');
      runButton.disabled = false;
      result.textContent = 'Готово. Можно заполнять руками или нажать «Заполнить и отправить».';

      const put = (key, text) => {
        const input = form.querySelector(`[data-request-input="${key}"]`);
        if (!input || input.disabled) return;
        input.value = text;
        input.dispatchEvent(new Event('input', {bubbles: true}));
      };

      const run = async () => {
        const messenger = params.get('messenger');
        if (messenger) {
          const radio = form.querySelector(`input[name="messenger"][value="${messenger}"]`);
          if (radio) { radio.checked = true; radio.dispatchEvent(new Event('change', {bubbles: true})); }
        }
        put('name', 'Анна Тестова');
        put('email', 'anna@gmail.com');
        put('phone', '89123456789');
        put('telegram', 't.me/anna_psy');
        form.querySelector('[data-request-submit]').click();
        const deadline = Date.now() + 5000;
        while (Date.now() < deadline) {
          if (form.dataset.state === 'success' || form.querySelector('[data-request-summary]').dataset.state === 'error' || (window.__fixtureEventDispatched && ['captcha', 'unrelated'].includes(event))) break;
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        const success = form.dataset.state === 'success';
        const busy = form.getAttribute('aria-busy') === 'true';
        const summary = form.querySelector('[data-request-summary]');
        const native = window.__requestFormFixture;
        const expectWait = ['captcha', 'unrelated'].includes(event);
        const expectError = ['error', 'validation', 'missing'].includes(event) || params.get('email') === 'required';
        const passed = event === 'missing' || params.get('email') === 'required'
          ? submitCount === 0 && summary.dataset.state === 'error' && !success
          : submitCount === 1 && (expectWait ? busy && !success : expectError ? !busy && !success && summary.dataset.state === 'error' : success && !busy);
        result.textContent = JSON.stringify({passed, mode, event, submitCount, success, busy, summary: summary.textContent, native, successText: form.querySelector('[data-request-success-text]')?.textContent}, null, 1);
      };
      runButton.addEventListener('click', run);
      if (params.get('auto') === '1') run();
    })().catch(error => { document.querySelector('#result').textContent = String(error); });
    </script>
