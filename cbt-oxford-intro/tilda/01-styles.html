/* Opt-in heading and section composition; load after the consuming component CSS. */

.section-title_component {
  width: 100%;

  font-family: var(--font-family-body);

}

  text-align: left;
}

.section-title_component.is-center {
  text-align: center;
}

.section-title_component.is-right {
  text-align: right;
}

/* The same responsive title scale can be used without changing section gaps. */
.section-title_component.is-responsive { --section-title-size: 2rem; --section-title-line-height: 1; overflow-wrap: anywhere; }
@media (min-width: 32.5625rem) {

  --transition-site: var(--motion-duration) var(--motion-easing);
  --page-padding: 1rem;
  --hero-section-offset: 1rem;
  --hero-section-end: var(--section-space);
  --hero-section-end-desktop: var(--section-space);
