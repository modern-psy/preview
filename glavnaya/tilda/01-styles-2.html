/* Панель выбранного подхода: название, ссылка на курс, лента карточек */

/* ---------- 7. Как устроено обучение: бенто с живыми мини-интерфейсами ----------
/* 16.11.2026: по просьбе Дарьи весь текст в разделах 7–8 не меньше 16 px (было 12–15 px), включая мини-интерфейсы. */
   Плитки белые; внутри серая «сцена» с маленьким интерфейсом. Большая плитка — практика.
   Анимации крутятся, только когда у секции есть класс is-run (секция на экране) */
.section_home-learning { padding-top: var(--home-section); }
.learning_grid { display: grid; gap: var(--home-gap); }

@media (min-width: 48rem) {

}

}
.learning-tile_component {

}

.practice_head { display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 1rem 1.5rem; }
.practice_head .learning-tile_title { margin-top: 0; }
.practice-switch_component { display: inline-flex; gap: 0.25rem; padding: 0.25rem; border-radius: 0.75rem; background-color: var(--home-bg); }
.practice-switch_button {
  min-height: 2.5rem;
  padding: 0.375rem 1rem;
  border: 0;
  border-radius: 0.5rem;
  background: transparent;
  color: var(--home-text);
  font: 444 1rem/1.2 var(--home-font);

}

.practice_body { display: grid; gap: 1rem; flex: 1 1 auto; margin-top: 1rem; }

.practice-stage_component {

}
.practice-stage_links { position: absolute; inset: 0; width: 100%; height: 100%; }

.is-run .practice-stage_link { animation: learning-flow 1.6s linear infinite; }
@keyframes learning-flow { to { stroke-dashoffset: -20; } }
/* Участник схемы. Обёртка размером со сцену сдвигается на --x/--y (проценты от её размера = от размера сцены):
   двигаем только transform, без left/top, иначе Safari пересчитывает раскладку на каждом кадре.
   Сам кружок с подписью стоит в левом верхнем углу обёртки и центрируется на точке. */
.practice-person_component {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform: translate(var(--x, 50%), var(--y, 50%));
  transition: transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
}
.practice-person_body {
  position: absolute;
  left: 0;
  top: 0;
  display: grid;
  justify-items: center;
  gap: 0.375rem;
  transform: translate(-50%, -50%);
}

}

}

.practice-stage_teacher {

  top: 6%;

  padding: 0.25rem 0.75rem;

  color: var(--home-white);
  font: 444 1rem/1.2 var(--home-font);

  transition: opacity var(--home-motion);
}
.practice-stage_teacher.is-on { opacity: 1; }

.practice_text { color: var(--home-muted); }

/* Лекции */
.learning-lessons_list { position: absolute; inset: 0.75rem; display: grid; gap: 0.375rem; align-content: center; }

.learning-lesson_item > span:nth-child(2) { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Вебинары */

/* Домашние задания */
.learning-tasks_list { position: absolute; inset: 0.75rem; display: grid; gap: 0.375rem; align-content: center; }

/* Документ */

/* Сообщество */

@media (prefers-reduced-motion: reduce) {

/* ---------- 8. Не только курсы ---------- */
.section_home-beyond { padding-top: var(--home-section); } /* снизу без отступа: его даёт следующая секция, иначе зазор двойной */

.conf-list_tab.is-active .conf-list_name { color: var(--home-accent); }
.conf-list_tab.is-active .conf-list_year { color: var(--home-text); }
.conf-list_tab.is-active .conf-list_play { background-color: var(--home-dark); color: var(--home-white); }

/* Три карточки — каждая в своём характере: белая с расписанием, тёмная с чатом, лиловая с узором */
.beyond-cards_list { display: grid; gap: var(--home-gap); margin-top: var(--home-gap); }
.beyond-cards_list > * { min-width: 0; }
@media (min-width: 48rem) {
  .beyond-cards_list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .beyond-card_component.is-rodbt { grid-column: 1 / -1; }
}
@media (min-width: 64.0625rem) {
  .beyond-cards_list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .beyond-card_component.is-rodbt { grid-column: auto; }
}
.beyond-card_component {
  display: flex;
  flex-direction: column;
  padding: var(--home-card-pad-lg);
  border-radius: var(--home-radius-lg);
  background-color: var(--home-surface);
}
.beyond-card_title { margin-top: 1rem; }
.beyond-card_text { margin-top: 0.375rem; color: var(--home-muted); }
/* Подписи is-caption в разделах 7–8 на телефоне 16 px, а не 15 (по просьбе Дарьи); на десктопе как в типографике, 18 px */
.section_home-learning .body-text_component.is-caption,
.section_home-beyond .body-text_component.is-caption { font-size: 1rem; }
@media (min-width: 64.0625rem) {
  .section_home-learning .body-text_component.is-caption,
  .section_home-beyond .body-text_component.is-caption { font-size: 1.125rem; }
}
.beyond-card_link {
  margin-top: auto;
  padding-top: 1rem;
  align-self: flex-start;
  color: var(--home-accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

/* Практикум: мини-расписание */
.practicum-ui_component { display: grid; gap: 0.375rem; padding: 0.75rem; border-radius: 0.875rem; background-color: var(--home-bg); }
.practicum-ui_row { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; align-items: center; gap: 0.625rem; padding: 0.375rem 0.375rem 0.375rem 0.5rem; border-radius: 0.625rem; background-color: var(--home-surface); font-size: 1rem; }
.practicum-ui_day { display: grid; place-items: center; height: 2rem; border-radius: 0.5rem; background-color: var(--home-soft); color: var(--home-soft-text); font-weight: 500; }
.practicum-ui_btn { padding: 0.25rem 0.625rem; border-radius: 0.5rem; background-color: var(--home-dark); color: var(--home-white); font-size: 1rem; }
.practicum-ui_row:nth-child(2) .practicum-ui_btn { background-color: var(--home-soft); color: var(--home-soft-text); }

/* Выпускники: тёмная карточка, чат и лица */
.beyond-card_component.is-alumni { background-color: var(--home-dark); color: var(--home-white); }
.is-alumni .beyond-card_text { color: var(--home-on-dark-muted); }
.is-alumni .beyond-card_link { color: var(--home-white); }
.is-alumni :focus-visible { outline-color: var(--home-white); }
.alumni-ui_component { display: grid; gap: 0.375rem; padding: 0.75rem; border-radius: 0.875rem; background-color: color-mix(in srgb, var(--home-white) 6%, transparent); }
.alumni-ui_msg { justify-self: start; max-width: 85%; padding: 0.4375rem 0.75rem; border-radius: 0.875rem 0.875rem 0.875rem 0.25rem; background-color: color-mix(in srgb, var(--home-white) 12%, transparent); font-size: 1rem; line-height: 1.3; }
.alumni-ui_msg.is-reply { justify-self: end; border-radius: 0.875rem 0.875rem 0.25rem 0.875rem; background-color: var(--home-accent); }
.alumni-ui_faces { display: flex; margin-top: 0.25rem; }
.alumni-ui_faces i { display: grid; place-items: center; width: 1.875rem; height: 1.875rem; margin-right: -0.375rem; border: 2px solid var(--home-dark); border-radius: 50%; background-color: #4a4152; font-size: 1rem; font-style: normal; font-weight: 500; }
.alumni-ui_faces i:last-child { background-color: var(--home-soft); color: var(--home-soft-text); }

/* RO DBT: лиловая карточка, фоном узор «Выход из круга» (геометрию рисует build.mjs), текст на белой плашке.
   Цвет узора — фиолетовый Академии, кольца приглушены до тона подложки; одна точка залита целиком */
.beyond-card_component.is-rodbt { position: relative; overflow: hidden; background-color: var(--home-soft); }
.rodbt-card_pattern { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--home-accent); fill: currentColor; }
.rodbt-card_tone { opacity: 0.3; }
.rodbt-card_rings { fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; }
.is-rodbt > :not(.rodbt-card_pattern) { position: relative; }
/* под бейджем оставляем место, чтобы узор был виден между ним и плашкой */
.is-rodbt .beyond-card_badge { margin-bottom: 6rem; }
.rodbt-card_plate { display: flex; flex-direction: column; margin-top: auto; padding: 1rem; border-radius: 0.875rem; background-color: var(--home-surface); }
/* на планшете карточка во всю ширину: плашка слева, справа остаётся узор с залитой точкой */
@media (min-width: 48rem) { .rodbt-card_plate { max-width: 28rem; } }
.is-rodbt .beyond-card_title { margin-top: 0; }
.is-rodbt .beyond-card_text { color: var(--home-soft-text); }
.is-rodbt .beyond-card_link { padding-top: 0.75rem; }
.beyond-card_badge { align-self: flex-start; padding: 0.375rem 0.75rem; border-radius: 999px; background-color: var(--home-surface); color: var(--home-soft-text); font: 500 1rem/1.25 var(--home-font); }

/* ---------- 9. Нам доверяют ---------- */
.section_home-trust { padding-top: var(--home-section); padding-bottom: var(--home-section); overflow-x: clip; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Оценки площадок: тёмная плитка с общим числом отзывов и плитки-ссылки на площадки (2×2 на телефоне, в ряд с 768) */
.trust-scores_list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--home-gap); margin: 0; padding: 0; list-style: none; }
@media (min-width: 48rem) { .trust-scores_list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.trust-scores_list > li { display: flex; min-width: 0; }
.trust-score_tile { display: flex; flex-direction: column; gap: 0.25rem; width: 100%; padding: var(--home-card-pad-lg); border-radius: var(--home-radius-lg); background-color: var(--home-surface); color: inherit; text-decoration: none; }
.trust-score_tile.is-summary { background-color: var(--home-dark); color: var(--home-white); }
.trust-score_value { font-size: clamp(2.5rem, 2rem + 1.6vw, 3.5rem); font-weight: 500; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.trust-score_count { color: var(--home-muted); transition: color var(--home-motion); }
.trust-score_tile.is-summary .trust-score_count { color: var(--home-on-dark-muted); }
.trust-score_logo { width: auto; height: 1.5rem; max-width: 100%; margin-top: auto; padding-top: 1.25rem; box-sizing: content-box; object-fit: contain; object-position: left center; }

/* Отзывы: тёмная доска с лентой. Видео — отдельная колонка, текстовые отзывы — по два в колонке */
.trust-board_component { margin-top: 2rem; padding: var(--home-card-pad-lg); overflow: hidden; border-radius: var(--home-radius-lg); background-color: var(--home-dark); color: var(--home-white); }
.trust-board_head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
.trust-board_component .slider-controls_button { background-color: color-mix(in srgb, var(--home-white) 10%, transparent); color: var(--home-white); }
.trust-board_component :focus-visible { outline-color: var(--home-white); }
.trust-reviews_track {
  position: relative;
  display: flex;
  gap: var(--home-gap);
  margin: 0 calc(var(--home-card-pad-lg) * -1);
  padding: 0 var(--home-card-pad-lg);
  scroll-padding-inline: var(--home-card-pad-lg);
  list-style: none;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.trust-reviews_track::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: no-preference) { .trust-reviews_track { scroll-behavior: smooth; } }
.trust-reviews_item { display: flex; flex-direction: column; flex: 0 0 76%; gap: var(--home-gap); min-width: 0; scroll-snap-align: start; }
.trust-reviews_item.is-quotes { flex-basis: 86%; }
@media (min-width: 32.5625rem) { .trust-reviews_item { flex-basis: 17rem; } .trust-reviews_item.is-quotes { flex-basis: 22rem; } }
@media (min-width: 64.0625rem) { .trust-reviews_item { flex-basis: 18rem; } .trust-reviews_item.is-quotes { flex-basis: 24rem; } }

.trust-video_component { position: relative; flex: 1 1 auto; overflow: hidden; aspect-ratio: 4 / 5; border-radius: var(--home-radius); background-color: #3a3142; }
.trust-video_poster, .trust-video_component video, .trust-video_component iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.trust-video_component video, .trust-video_component iframe { background-color: #000000; object-fit: contain; }
.trust-video_play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.trust-video_play-icon { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 50%; background-color: var(--home-white); color: var(--home-dark); transition: transform var(--home-motion); }
.trust-video_play-icon svg { width: 1.125rem; height: 1.125rem; margin-left: 2px; }
.trust-video_caption { padding: 0 0.25rem; font-size: 0.9375rem; line-height: 1.35; }
.trust-video_caption span { display: block; margin-top: 0.25rem; color: var(--home-on-dark-muted); font-size: 0.8125rem; }

.trust-quote_card { display: flex; flex: 1 1 auto; flex-direction: column; gap: 0.875rem; padding: var(--home-card-pad-lg); border-radius: var(--home-radius); background-color: color-mix(in srgb, var(--home-white) 7%, transparent); }
.trust-quote_text { font-size: 1.125rem; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.trust-quote_more { color: var(--home-on-dark-muted); }
.trust-quote_card .trust-person_component { margin-top: auto; }
.trust-quote_open { align-self: flex-start; padding: 0; border: 0; background: none; color: var(--home-white); font: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; cursor: pointer; }
.trust-person_component { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
.trust-person_photo { flex: 0 0 auto; width: 2.75rem; height: 2.75rem; border-radius: 50%; object-fit: cover; background-color: #3a3142; }
.trust-person_photo.is-large { width: 4rem; height: 4rem; background-color: var(--home-soft); }
.trust-person_name { font-size: 0.9375rem; font-weight: 500; line-height: 1.25; }
.trust-person_course { color: var(--home-on-dark-muted); font-size: 0.8125rem; line-height: 1.3; }

/* Окно с полным отзывом */
.trust-dialog_component { width: min(40rem, calc(100% - 2rem)); max-height: min(44rem, calc(100dvh - 2rem)); padding: 1.5rem; border: 0; border-radius: var(--home-radius-lg); background-color: var(--home-surface); color: var(--home-text); overflow: auto; }
.trust-dialog_component::backdrop { background-color: rgba(43, 35, 52, 0.6); }
.trust-dialog_head { display: flex; align-items: center; gap: 1rem; padding-right: 3rem; }
.trust-dialog_component .trust-person_course { color: var(--home-muted); }
.trust-dialog_text { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
.trust-dialog_close { position: absolute; top: 1rem; right: 1rem; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; padding: 0; border: 0; border-radius: 50%; background-color: #e8e7ee; color: #2b2b36; cursor: pointer; }
.trust-dialog_close svg { width: 1.125rem; height: 1.125rem; }

/* Партнёры: две бегущие ленты от края до края, вторая едет в обратную сторону */
.trust-partners_head { display: grid; gap: 0.375rem; margin: 3rem 0 1.25rem; }
.trust-partners_text { color: var(--home-muted); }
.trust-marquee_component { display: grid; gap: var(--home-gap); }
.trust-marquee_row {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 clamp(2.5rem, 10%, 7rem), #000 calc(100% - clamp(2.5rem, 10%, 7rem)), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 clamp(2.5rem, 10%, 7rem), #000 calc(100% - clamp(2.5rem, 10%, 7rem)), transparent);
}
.trust-marquee_list { display: flex; gap: var(--home-gap); width: max-content; margin: 0; padding: 0; list-style: none; }
.trust-marquee_item { display: grid; place-items: center; width: 11rem; height: 5.5rem; padding: 1rem; border-radius: var(--home-radius); background-color: var(--home-surface); }
@media (min-width: 48rem) { .trust-marquee_item { width: 13rem; height: 6rem; } }
.trust-partner_logo { display: block; width: auto; height: var(--logo-h); max-width: 100%; }
.trust-partner_name { color: #3c234f; font-size: 1.25rem; font-weight: 500; letter-spacing: 0.04em; }
@media (prefers-reduced-motion: no-preference) {
  .trust-marquee_list { animation: trust-marquee 70s linear infinite; }
  .trust-marquee_row.is-reverse .trust-marquee_list { animation-direction: reverse; }
  /* за экраном ленты стоят (класс ставит скрипт) */
  .trust-marquee_component.is-offscreen .trust-marquee_list { animation-play-state: paused; }
}
/* наведение мышью останавливает ленту; на телефоне не включаем, иначе пауза залипает после касания */
@media (prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine) {
  .trust-marquee_row:hover .trust-marquee_list { animation-play-state: paused; }
}
/* Сдвиг ровно на половину ленты (список + копия): вторая половина встаёт на место первой, шов не виден */
@keyframes trust-marquee { to { transform: translateX(calc(-50% - var(--home-gap) / 2)); } }
@media (prefers-reduced-motion: reduce) { .trust-marquee_row { overflow-x: auto; } }

/* ---------- 10. Поможем подобрать программу ---------- */
/* Тёмная плашка: слева вопрос с вариантами и ответ на выбор, справа форма (как форма курсов Академии, без почты) */
.section_home-pick { padding-bottom: var(--home-section); }
.pick-card_component { display: grid; gap: 2rem; padding: 1.25rem; border-radius: var(--home-radius-lg); background-color: var(--home-dark); color: var(--home-white); }
@media (min-width: 48rem) { .pick-card_component { padding: 1.5rem; } }
/* На десктопе карточка шириной как формы заявки на лендингах (центральные 10 из 12 колонок, 63rem) и по центру */
@media (min-width: 64.0625rem) { .pick-card_component { max-width: 63rem; margin-inline: auto; grid-template-columns: minmax(0, 1fr) minmax(0, 25rem); gap: 2.5rem; padding: 2rem; } }
.pick-card_component :focus-visible { outline-color: var(--home-white); }
.pick-card_intro { display: flex; flex-direction: column; min-width: 0; }
.pick-card_title { color: var(--home-white); }
.pick-card_label { margin-top: 1.75rem; font-size: 1.0625rem; font-weight: 500; }
.pick-chip_list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.875rem 0 0; padding: 0; list-style: none; }
.pick-chip_button { min-height: 2.75rem; padding: 0.625rem 1rem; border: 1px solid color-mix(in srgb, var(--home-white) 28%, transparent); border-radius: 999px; background: none; color: var(--home-white); font: inherit; font-size: 0.9375rem; line-height: 1.2; text-align: left; cursor: pointer; transition: background-color var(--home-motion), color var(--home-motion), border-color var(--home-motion); }
.pick-chip_button[aria-pressed="true"] { border-color: var(--home-white); background-color: var(--home-white); color: var(--home-dark); }
/* Ответ на выбор: до выбора — подсказка приглушённым цветом */
.pick-card_reply { margin-top: 1.5rem; padding: 0.875rem 1rem; border-radius: var(--home-radius); background-color: color-mix(in srgb, var(--home-white) 7%, transparent); font-size: 0.9375rem; line-height: 1.4; }
.pick-card_reply [data-pick-reply="none"] { color: var(--home-on-dark-muted); }
.pick-card_reply [hidden] { display: none; }
/* На десктопе ответ прижат к низу колонки — вровень с концом формы справа */
@media (min-width: 64.0625rem) { .pick-card_reply { margin-top: auto; } .pick-chip_list { margin-bottom: 1.5rem; } }

/* Поля: подпись внутри поля, при вводе уменьшается и уезжает вверх */
.pick-form_component { display: grid; gap: 1rem; }
.pick-form_component[hidden], .pick-form_success[hidden], .pick-messenger_nick[hidden] { display: none; }
.pick-form_fields { display: grid; gap: 0.5rem; }
.pick-field_component { position: relative; }
.pick-field_input { display: block; width: 100%; height: 3.75rem; padding: 1.375rem 1rem 0.375rem; border: 1px solid color-mix(in srgb, var(--home-white) 28%, transparent); border-radius: 0.75rem; background: transparent; color: var(--home-white); font: inherit; font-size: 1rem; transition: border-color var(--home-motion); }
.pick-field_input:focus { border-color: var(--home-white); outline: none; }
.pick-field_label { position: absolute; top: 50%; left: 1rem; max-width: calc(100% - 2rem); overflow: hidden; color: color-mix(in srgb, var(--home-white) 62%, transparent); font-size: 1rem; white-space: nowrap; text-overflow: ellipsis; transform: translateY(-50%); transform-origin: left center; pointer-events: none; transition: transform var(--home-motion); }
/* Подпись уезжает вверх только через transform (без top): -1.25rem = от середины поля 3.75rem до прежних 0.625rem */
.pick-field_input:focus + .pick-field_label, .pick-field_input:not(:placeholder-shown) + .pick-field_label { transform: translateY(calc(-15% - 1.25rem)) scale(0.78); }
.pick-messenger_component { margin: 0; padding: 0; border: 0; }
.pick-messenger_legend { margin-bottom: 0.625rem; padding: 0; color: var(--home-on-dark-muted); font-size: 0.9375rem; }
.pick-messenger_options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
.pick-messenger_input { position: absolute; opacity: 0; pointer-events: none; }
.pick-messenger_option { display: flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 3rem; padding: 0.5rem 1rem; border: 1px solid color-mix(in srgb, var(--home-white) 28%, transparent); border-radius: 0.75rem; color: var(--home-white); cursor: pointer; transition: background-color var(--home-motion), color var(--home-motion), border-color var(--home-motion); }
.pick-messenger_option svg { width: 1.125rem; height: 1.125rem; }
.pick-messenger_input:checked + .pick-messenger_option { border-color: var(--home-white); background-color: var(--home-white); color: var(--home-dark); }
.pick-messenger_input:focus-visible + .pick-messenger_option { outline: 2px solid var(--home-white); outline-offset: 2px; }
.pick-messenger_nick { margin-top: 0.5rem; }
/* Кнопка становится активной, когда всё заполнено (как в форме курсов) */
.pick-form_submit { min-height: 3.5rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 1rem; background-color: var(--home-accent); color: var(--home-white); font: inherit; font-size: 1.0625rem; font-weight: 500; cursor: pointer; transition: background-color var(--home-motion), color var(--home-motion); }
.pick-form_submit:disabled { background-color: color-mix(in srgb, var(--home-white) 14%, transparent); color: color-mix(in srgb, var(--home-white) 60%, transparent); cursor: default; }
.pick-form_submit[aria-busy="true"] { cursor: progress; }
.pick-form_status:empty { display: none; }
.pick-form_status { color: var(--home-error-on-dark); font-size: 0.875rem; line-height: 1.4; }
.pick-form_status a { color: inherit; }
/* Подсказка под полем, когда значение не подходит */
.pick-field_hint { margin-top: -0.125rem; color: var(--home-error-on-dark); font-size: 0.8125rem; line-height: 1.35; }
.pick-field_hint[hidden] { display: none; }
/* Нативная форма Тильды «mainpage»: заявку в неё кладёт скрипт, на странице её не видно.
   Прячем без display:none (скриптам Тильды нужно измерять поля). Метку ставит скрипт (pickHideTilda),
   правило с :has прячет форму, даже если скрипт ещё не отработал. */
[data-home-native-form-record],
.t-rec:has(input[name="tildaspec-formname"][value="mainpage"]) { position: absolute !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; overflow: hidden !important; border: 0 !important; clip: rect(0 0 0 0); clip-path: inset(50%); pointer-events: none !important; white-space: nowrap !important; }
.pick-messenger_component .pick-field_hint { margin-top: 0.375rem; }
.pick-field_input[aria-invalid="true"] { border-color: var(--home-error-on-dark); }
.pick-form_legal { color: color-mix(in srgb, var(--home-white) 62%, transparent); font-size: 0.75rem; line-height: 1.4; }
.pick-form_legal a { color: inherit; }
.pick-form_success { display: grid; gap: 0.5rem; padding: 1.5rem; border-radius: var(--home-radius); background-color: color-mix(in srgb, var(--home-white) 7%, transparent); }
.pick-form_success .body-text_component { color: var(--home-on-dark-muted); }

/* ---------- Наведение: только на устройствах с мышью ---------- */
@media (hover: hover) and (pointer: fine) {
