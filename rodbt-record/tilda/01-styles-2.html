/* === web-academy/shared/academy/lead-form-responsive.css === */
/* New four-layout contract is opt-in; legacy consumers keep their current UI. */
.lead-form_component.is-responsive {
  --lead-form-padding: 1rem;
  --lead-form-control-font-size: 0.9375rem;
  --lead-form-input-height: 3.125rem;
  --lead-form-input-inset: 0.75rem;
  --lead-form-choice-height: 3rem;
  --lead-form-choice-icon: 1.125rem;
  --lead-form-small-text: 0.75rem;
  --section-title-line-height: 1.1;
  --section-subtitle-line-height: 1.1;
  --section-subtitle-tracking: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 2rem;
  align-items: start;
}
.lead-form_component.is-responsive .section-title_component { line-height: 1.1; }
.lead-form_component.is-responsive .lead-form_body { gap: 1.25rem; }
.lead-form_component.is-responsive .lead-form_submit-group { margin-top: 0.125rem; }
.lead-form_component.is-responsive .lead-form_input,
.lead-form_component.is-responsive .lead-form_control > .iti > .lead-form_input { height: var(--lead-form-input-height); padding-left: var(--lead-form-input-inset); }
.lead-form_component.is-responsive .lead-form_label { left: var(--lead-form-input-inset); }
.lead-form_component.is-responsive .lead-form_messenger-option { min-height: var(--lead-form-choice-height); padding-inline: 0.75rem; }
.lead-form_component.is-responsive .lead-form_messenger-icon { width: var(--lead-form-choice-icon); height: var(--lead-form-choice-icon); }
.lead-form_component.is-responsive .lead-form_error,
.lead-form_component.is-responsive .lead-form_legal { font-size: var(--lead-form-small-text); }
.lead-form_component.is-responsive .lead-form_messenger-input:not(:checked) + .lead-form_messenger-option { color: var(--color-text-on-dark); border-color: var(--color-text-on-dark); }

  .lead-form_component.is-responsive { --lead-form-padding: 1.25rem; --lead-form-control-font-size: 1rem; --lead-form-input-height: 3.75rem; --lead-form-input-inset: 1rem; --lead-form-small-text: 0.875rem; gap: 2.25rem; }

/* === web-academy/shared/academy/pricing-promo.css === */
/* Промо-блок цены: слева курс, справа деньги. Плоская тёмная поверхность, без карточек, градиентов и кнопок. */
.pricing-promo_component {
  --pricing-promo-text: var(--color-text-on-dark-muted);
  --pricing-promo-muted: #bdb7b7;
  --pricing-promo-faint: #99929f;
  --pricing-promo-line: rgb(255 255 255 / 14%);
  --pricing-promo-featured-surface: #3a2f48;
  --pricing-promo-tabs-surface: #4c3c5e;
  --pricing-promo-tab-active: var(--color-accent-primary);
  --pricing-promo-number-size: 2.5rem;
  --pricing-promo-row-number-size: 1.75rem;
  --pricing-promo-suffix-size: 1rem;
  --section-subtitle-color: var(--pricing-promo-text);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  width: 100%;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--pricing-promo-text);
}

.pricing-promo_component [hidden] { display: none; }
/* Пока идёт запрос к CMS, деньги чуть прозрачные; блок целиком перерисуется по ответу. */
.pricing-promo[data-cms-state="loading"] .pricing-promo_price { opacity: 0.55; transition: opacity var(--transition-site, 250ms linear); }
.pricing-promo_old { margin-right: 0.25rem; color: var(--pricing-promo-muted); font-size: 0.55em; font-weight: 400; text-decoration: line-through; }
.pricing-promo_unconfirmed { font-size: 1.375rem; line-height: 1.2; }
.pricing-promo_discount { --body-text-color: var(--color-text-on-dark); }

.pricing-promo_tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(max-content, 1fr);
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  align-self: flex-start;
  padding: 0.125rem;
  border-radius: 6rem;
  background: var(--pricing-promo-tabs-surface);
}

.pricing-promo_tab {
  min-width: 0;
  min-height: 2.75rem;
  padding: 0.25rem 0.75rem;
  border: 0;
  border-radius: inherit;
  background: transparent;
  color: var(--pricing-promo-muted);
  font: 400 1rem / 1.2 var(--font-family-body);
  white-space: nowrap;
  overflow-wrap: normal;
  cursor: pointer;
  transition: color var(--transition-site, 250ms linear), background-color var(--transition-site, 250ms linear);
}
.pricing-promo_tab[aria-selected="true"], .pricing-promo_tab:hover { color: var(--color-text-on-dark); }
.pricing-promo_tab:hover { background-color: rgb(255 255 255 / 6%); }
.pricing-promo_tab[aria-selected="true"] { background-color: var(--pricing-promo-tab-active); }
.pricing-promo_tab:focus-visible { outline: 2px solid var(--color-text-on-dark); outline-offset: -3px; }
.pricing-promo_panel:focus-visible { outline: 2px solid var(--color-text-on-dark); outline-offset: 3px; }

.pricing-promo_panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; align-items: center; }
.pricing-promo_heading { color: var(--color-text-on-dark); }
.pricing-promo_tabs { order: -1; }
.pricing-promo_intro { display: flex; flex-direction: column; gap: var(--space-heading-copy, 1.25rem); min-width: 0; }
.pricing-promo_copy { display: flex; flex-direction: column; gap: var(--space-subtitle-pair, 0.5rem); max-width: 34rem; }
