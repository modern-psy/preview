.pains-reply_heading { max-width: 46rem; }

/* ===== «Тренинг о тренинге» — фото на фоне и путь стеклянными карточками (выбран 12.10.2026) =====
   Фото приглушено: чуть меньше насыщенности и затемнение в тон поля #2B2334 (слева и снизу плотнее — там белый текст,
   фон под мелким текстом не светлее #767676). Стеклянные карточки тёмные с размытием, финал — белая карточка.
   Шаги соединены тонкой линией. Телефон и до 767px: фото сверху, его низ растворяется в поле, ниже текст и шаги
   столбиком. 768–1024px: шаги 2 × 2 поверх фото. От 1025px: шаги в один ряд. */
.format-path_component { position: relative; display: grid; overflow: hidden; border-radius: 1.5rem; background: #2b2334; color: #fff; isolation: isolate; }
.format-path_media { position: relative; aspect-ratio: 4 / 3; }
.format-path_media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(43 35 52 / 15%) 0%, rgb(43 35 52 / 35%) 55%, #2b2334 100%); }
.format-path_image { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; filter: saturate(0.8); }
.format-path_content { position: relative; z-index: 1; display: grid; gap: 1.5rem; margin-top: -2.5rem; padding: 0 1rem 1rem; }
.format-path_header { display: grid; gap: 0.75rem; }
.format-path_heading { color: #fff; }
.format-path_lead { max-width: 34rem; color: #e6e5eb; font-size: 1rem; line-height: 1.4; }
.format-path_steps { position: relative; display: grid; gap: 0.625rem; margin: 0; padding: 0; list-style: none; }
.format-path_step { position: relative; display: grid; align-content: start; gap: 0.25rem; padding: 0.875rem 1rem; border: 1px solid rgb(255 255 255 / 12%); border-radius: 1rem; background: rgb(56 48 65 / 92%); }
.format-path_title { color: #fff; font-size: 1.125rem; font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; }
.format-path_text { color: #e6e5eb; font-size: 0.9375rem; line-height: 1.35; }
.format-path_step.is-final { border-color: #fff; background: #fff; }
.format-path_step.is-final .format-path_title { color: var(--color-text-primary); }
.format-path_step.is-final .format-path_text { color: var(--color-text-secondary-large); }
@media (min-width: 48rem) {
  .format-path_component { min-height: 36rem; border-radius: 1.75rem; }
  .format-path_media { position: absolute; inset: 0; aspect-ratio: auto; }
  .format-path_media::after { background: linear-gradient(180deg, rgb(43 35 52 / 72%) 0%, rgb(43 35 52 / 0%) 45%), linear-gradient(90deg, rgb(43 35 52 / 88%) 0%, rgb(43 35 52 / 62%) 42%, rgb(43 35 52 / 30%) 72%, rgb(43 35 52 / 22%) 100%), linear-gradient(0deg, rgb(43 35 52 / 92%) 0%, rgb(43 35 52 / 40%) 40%, rgb(43 35 52 / 0%) 65%); }
  .format-path_lead { color: #fff; }
  .format-path_content { align-content: space-between; gap: 6rem; margin-top: 0; padding: 2.5rem 2rem 2rem; }
  .format-path_lead { font-size: 1.125rem; }
  .format-path_steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
  .format-path_step { padding: 1rem 1.25rem; background: rgb(43 35 52 / 66%); -webkit-backdrop-filter: blur(0.875rem) saturate(1.1); backdrop-filter: blur(0.875rem) saturate(1.1); }
  .format-path_step.is-final { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (min-width: 64.0625rem) {
  /* На компьютере текст занимает левую половину — верхнее затемнение можно ослабить. */
  .format-path_media::after { background: linear-gradient(180deg, rgb(43 35 52 / 55%) 0%, rgb(43 35 52 / 0%) 38%), linear-gradient(90deg, rgb(43 35 52 / 88%) 0%, rgb(43 35 52 / 62%) 42%, rgb(43 35 52 / 30%) 72%, rgb(43 35 52 / 22%) 100%), linear-gradient(0deg, rgb(43 35 52 / 92%) 0%, rgb(43 35 52 / 40%) 40%, rgb(43 35 52 / 0%) 65%); }
  .format-path_component { min-height: 40rem; }
  .format-path_content { padding: 3rem; }
  .format-path_lead { font-size: 1.25rem; }
  .format-path_steps { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem; }
  /* Линия пути: короткий отрезок между соседними карточками. */
  .format-path_step:not(:last-child)::after { content: ""; position: absolute; top: 50%; left: 100%; width: 1.5rem; border-top: 1px solid rgb(255 255 255 / 45%); }
  .format-path_step.is-final { transform: translateY(-0.25rem); }
  .format-path_title { font-size: 1.25rem; }
  .format-path_text { font-size: 1rem; }
}

/* ===== «После курса вы сможете» — лист «Мой тренинг» и навыки вокруг (выбран 12.10.2026) =====
   Лист нарисован HTML и CSS: белый, чуть повёрнут, за ним второй лист для объёма, мягкая тень со смещением.
   Строки на листе — условные полоски, внизу фиолетовая печать «готов к работе» с галочкой. Навыки — заголовок и пояснение серым.
   Телефон: лист сверху, навыки столбиком. 768–1024px: лист сверху, навыки в две колонки. От 1025px: навыки по бокам. */
.outcomes-doc_component { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "visual" "left" "right"; gap: 1.5rem 2rem; }
.outcomes-doc_list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.outcomes-doc_list.is-left { grid-area: left; }
.outcomes-doc_list.is-right { grid-area: right; margin-top: -1.5rem; }
.outcomes-doc_skill { display: grid; gap: 0.25rem; padding: 1rem 0; border-top: 1px solid rgb(51 47 65 / 12%); }
.outcomes-doc_skill-title { color: var(--color-text-primary); font-size: 1.375rem; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em; }
.outcomes-doc_skill-text { color: var(--color-text-secondary-large); font-size: 1rem; line-height: 1.4; text-wrap: pretty; }
.outcomes-doc_visual { position: relative; grid-area: visual; justify-self: center; width: min(100%, 16rem); aspect-ratio: 4 / 5; margin: 0.5rem 0 1rem; }
.outcomes-doc_sheet { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 0.625rem; padding: 1.5rem 1.375rem; border-radius: 0.75rem; background: #fff; box-shadow: 0 1.5rem 3rem -1rem rgb(43 35 52 / 22%), 0 0.25rem 0.75rem rgb(43 35 52 / 6%); transform: rotate(-4deg); }
.outcomes-doc_sheet.is-back { background: #ebeaf0; box-shadow: none; transform: rotate(3deg) translate(0.5rem, 0.25rem); }
.outcomes-doc_title { margin-bottom: 0.375rem; color: var(--color-text-primary); font-size: 1.375rem; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; }
.outcomes-doc_line { display: block; width: 70%; height: 0.5rem; border-radius: 1rem; background: #e3e1e8; }
.outcomes-doc_line.is-long { width: 88%; }
.outcomes-doc_plan { display: grid; gap: 0.625rem; margin: 0.75rem 0 0; padding: 0; list-style: none; }
.outcomes-doc_plan li { display: flex; align-items: center; gap: 0.5rem; }
.outcomes-doc_dot { width: 0.625rem; height: 0.625rem; flex: none; border-radius: 50%; background: #d4d1db; }
.outcomes-doc_bar { display: block; height: 0.5rem; flex: 1; border-radius: 1rem; background: #ebeaf0; }
.outcomes-doc_plan li:nth-child(2) .outcomes-doc_bar { flex: 0 1 80%; }
.outcomes-doc_plan li:nth-child(4) .outcomes-doc_bar { flex: 0 1 65%; }
.outcomes-doc_plan li:nth-child(5) .outcomes-doc_bar { flex: 0 1 90%; }
.outcomes-doc_plan li:nth-child(6) .outcomes-doc_bar { flex: 0 1 55%; }
/* Печать — единственное цветное пятно на листе: фиолетовая, повёрнута сильнее листа и заходит за его правый край
   (на телефоне чуть-чуть, чтобы не вылезти за экран),
   как настоящий оттиск. multiply даёт эффект краски там, где печать ложится на серый фон и задний лист. */
.outcomes-doc_stamp { position: absolute; right: -0.5rem; bottom: 0.75rem; width: 6.5rem; height: 6.5rem; color: var(--color-accent-primary); transform: rotate(-16deg); mix-blend-mode: multiply; overflow: visible; }
.outcomes-doc_stamp-text { font-weight: 600; }
.outcomes-doc_closing { align-self: center; max-width: 40rem; padding: 0.75rem 1.25rem; border-radius: 1rem; background: #2b2334; color: #fff; font-size: 1rem; font-weight: 500; line-height: 1.35; text-align: center; text-wrap: balance; }
@media (min-width: 48rem) {
  .outcomes-doc_component { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "visual visual" "left right"; column-gap: 2.5rem; }
  .outcomes-doc_list.is-right { margin-top: 0; }
  .outcomes-doc_visual { width: 18rem; margin-bottom: 1.5rem; }
  .outcomes-doc_skill-title { font-size: 1.5rem; }
  .outcomes-doc_skill-text { font-size: 1.0625rem; }
  .outcomes-doc_closing { padding: 0.875rem 1.5rem; font-size: 1.125rem; }
  .outcomes-doc_stamp { right: -1.5rem; width: 7.5rem; height: 7.5rem; }
}
@media (min-width: 64.0625rem) {
  .outcomes-doc_component { grid-template-columns: minmax(0, 1fr) minmax(0, 22rem) minmax(0, 1fr); grid-template-areas: "left visual right"; align-items: center; column-gap: 4rem; }
  .outcomes-doc_visual { width: 100%; margin: 0; }
  .outcomes-doc_skill { padding: 1.25rem 0; }
  .outcomes-doc_skill:first-child { border-top: 0; }
  .outcomes-doc_sheet { padding: 2rem 1.75rem; }
  .outcomes-doc_title { font-size: 1.625rem; }
  .outcomes-doc_stamp { right: -2rem; bottom: 1.25rem; width: 8.75rem; height: 8.75rem; }
}

/* ===== Программа курса — табы модулей на тёмной плашке (выбран 13.10.2026, как на /rodbt и «Психосоматике») =====
   Тёмное поле, слева кнопки модулей (активная — фиолетовая), справа белая панель: заголовок, темы, сиреневая
   плашка «Результат». До 1025px колонки складываются: модули сверху, панель под ними.
   Внизу две кнопки: на телефоне друг под другом во всю ширину, с 768px рядом по центру. */
.treningi-dlya-detey-page .program-tabs_component { display: flex; width: 100%; min-width: 0; flex-direction: column; gap: var(--space-section-content); padding: var(--section-inset-space) var(--card-padding); border-radius: var(--radius-card, 1rem); background: var(--color-surface-dark); color: var(--color-text-on-dark); }
.treningi-dlya-detey-page .program-tabs_component .section-title_component { color: var(--color-text-on-dark); }
.treningi-dlya-detey-page .program-tabs_component .section-subtitle_component { color: var(--color-text-on-dark-muted); text-align: center; }
.treningi-dlya-detey-page .program-tabs_actions { display: flex; width: 100%; flex-direction: column; align-items: stretch; gap: 0.75rem; }
.treningi-dlya-detey-page .program-tabs_layout { display: grid; min-width: 0; grid-template-columns: minmax(0, 1fr); gap: var(--card-grid-gap); }
.treningi-dlya-detey-page .program-tabs_nav { display: flex; min-width: 0; flex-direction: column; gap: 0.5rem; }
.treningi-dlya-detey-page .program-tabs_tab { display: flex; min-width: 0; flex-direction: column; gap: 0.375rem; padding: 1rem; border: 0; border-radius: var(--radius-card, 1rem); background: #3a2f48; color: var(--color-text-on-dark); font-family: inherit; text-align: left; cursor: pointer; transition: background-color var(--transition-site); }
.treningi-dlya-detey-page .program-tabs_tab[aria-selected="true"] { background: var(--color-accent-primary); }
.treningi-dlya-detey-page .program-tabs_tab:focus-visible { outline: 2px solid var(--color-accent-soft); outline-offset: 2px; }
.treningi-dlya-detey-page .program-tabs_tab-label { color: var(--color-accent-soft); font-size: 0.9375rem; font-weight: 500; line-height: 1.2; }
.treningi-dlya-detey-page .program-tabs_tab[aria-selected="true"] .program-tabs_tab-label { color: var(--color-text-on-dark); }
.treningi-dlya-detey-page .program-tabs_tab-title { font-size: 1.125rem; font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; text-wrap: pretty; }
.treningi-dlya-detey-page .program-tabs_panels { display: grid; min-width: 0; }
.treningi-dlya-detey-page .program-tabs_panel { display: flex; min-width: 0; flex-direction: column; gap: 1.25rem; padding: 1rem; border-radius: var(--radius-card, 1rem); background: var(--color-surface-primary); color: var(--color-text-primary); }
.treningi-dlya-detey-page .program-tabs_panel[hidden] { display: none; }
.treningi-dlya-detey-page .program-tabs_panel.is-entering { animation: treningi-program-slide-in 320ms var(--motion-easing); }
@keyframes treningi-program-slide-in { from { opacity: 0; transform: translateX(1.5rem); } to { opacity: 1; transform: none; } }
.treningi-dlya-detey-page .program-tabs_title { color: var(--color-text-primary); font-size: 1.5rem; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
.treningi-dlya-detey-page .program-tabs_panel-copy { display: flex; min-width: 0; flex-direction: column; gap: 0.625rem; }
.treningi-dlya-detey-page .program-tabs_list-title { color: var(--color-text-secondary-large); font-size: 1rem; font-weight: 600; line-height: 1.3; }
.treningi-dlya-detey-page .program-tabs_topics { display: grid; gap: 0.625rem; margin: 0; padding: 0; list-style: none; }
.treningi-dlya-detey-page .program-tabs_topic { position: relative; padding-left: 1.25rem; color: var(--color-text-primary); font-size: 1.125rem; line-height: 1.35; text-wrap: pretty; }
.treningi-dlya-detey-page .program-tabs_topic::before { position: absolute; top: 0.5em; left: 0; width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--color-accent-primary); content: ""; }
.treningi-dlya-detey-page .program-tabs_result { display: flex; flex-direction: column; gap: 0.375rem; margin-top: auto; padding: 1rem; border-radius: 0.75rem; background: rgb(124 92 219 / 12%); }
.treningi-dlya-detey-page .program-tabs_result-label { color: var(--color-accent-text); font-size: 1rem; font-weight: 600; line-height: 1.3; }
.treningi-dlya-detey-page .program-tabs_result-text { color: var(--color-text-primary); font-size: 1.125rem; line-height: 1.35; text-wrap: pretty; }
/* Без скрипта видны все модули друг под другом, кнопки-табы скрыты. */
.treningi-dlya-detey-page [data-program-tabs]:not([data-ready]) .program-tabs_nav { display: none; }
.treningi-dlya-detey-page [data-program-tabs]:not([data-ready]) .program-tabs_panels { gap: var(--card-grid-gap); }
@media (min-width: 48rem) {
  .treningi-dlya-detey-page .program-tabs_actions { flex-direction: row; justify-content: center; gap: 1rem; }
  .treningi-dlya-detey-page .program-tabs_button { flex: 0 1 22.5rem; }
  .treningi-dlya-detey-page .program-tabs_component { padding-inline: 1.5rem; }
  .treningi-dlya-detey-page .program-tabs_panel { padding: 1.5rem; gap: 1.5rem; }
  .treningi-dlya-detey-page .program-tabs_tab { padding: 1.125rem 1.25rem; }
  .treningi-dlya-detey-page .program-tabs_result { padding: 1.25rem 1.5rem; }
}
@media (min-width: 64.0625rem) {
  .treningi-dlya-detey-page .program-tabs_component { padding-inline: 2.5rem; }
  /* Панель тянется на высоту колонки модулей; сама колонка остаётся на месте при прокрутке. */
  .treningi-dlya-detey-page .program-tabs_layout { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: stretch; }
  .treningi-dlya-detey-page .program-tabs_nav { position: sticky; top: 2rem; align-self: start; }
  .treningi-dlya-detey-page .program-tabs_panel { padding: 2.5rem; }
  .treningi-dlya-detey-page .program-tabs_tab-title { font-size: 1.25rem; }
  .treningi-dlya-detey-page .program-tabs_title { font-size: 1.75rem; }
  .treningi-dlya-detey-page .program-tabs_topic, .treningi-dlya-detey-page .program-tabs_result-text { font-size: 1.25rem; }
}
@media (hover: hover) and (pointer: fine) {
  .treningi-dlya-detey-page .program-tabs_tab:not([aria-selected="true"]):hover { background: #463a56; }
}
@media (prefers-reduced-motion: reduce) {
  .treningi-dlya-detey-page .program-tabs_panel.is-entering { animation: none; }
  .treningi-dlya-detey-page .program-tabs_tab { transition: none; }

/* ===== Преподаватели — вертикальная карточка (выбрана 13.10.2026, основа — широкая карточка «Нарративной практики») =====
   Сверху фото 4:3 (лицо не обрезается: кадр прижат к верху), под ним имя, роль, сиреневые плашки регалий,
   факты с галочками через тонкие линии. Телефон: карточки друг под другом. С 768px две рядом, одной высоты.
   Пока фото нет — инициалы на сиреневой подложке того же размера. */
.teachers-bio_list { display: grid; width: 100%; max-width: 64rem; grid-template-columns: minmax(0, 1fr); gap: var(--card-grid-gap); margin: 0 auto; padding: 0; list-style: none; }
.teachers-bio_item { display: flex; min-width: 0; }
.teachers-bio_card { display: flex; width: 100%; min-width: 0; flex-direction: column; gap: 1.25rem; padding: 1rem; border-radius: var(--radius-card, 1rem); background: var(--color-surface-primary); overflow-wrap: anywhere; }
.teachers-bio_photo { display: block; width: 100%; aspect-ratio: 4 / 3; overflow: clip; border-radius: 0.75rem; object-fit: cover; object-position: center top; }
.teachers-bio_photo.is-placeholder { display: grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent-text); font-size: 3rem; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
.teachers-bio_intro { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
.teachers-bio_name { color: var(--color-text-primary); font-size: 1.5rem; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; }
.teachers-bio_role { color: var(--color-text-secondary-large); font-size: 1.125rem; line-height: 1.3; }
.teachers-bio_tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 0; padding: 0; list-style: none; }
.teachers-bio_tag { display: inline-flex; align-items: center; padding: 0.375rem 0.75rem; border-radius: 0.375rem; background: var(--color-accent-soft); color: var(--color-accent-text); font-size: 0.9375rem; font-weight: 500; line-height: 1.3; }
.teachers-bio_facts { display: flex; min-width: 0; flex-direction: column; margin: 0; padding: 0; border-top: 1px solid rgb(51 47 65 / 12%); list-style: none; }
.teachers-bio_fact { display: flex; align-items: flex-start; gap: 0.625rem; padding: 0.875rem 0; border-bottom: 1px solid rgb(51 47 65 / 12%); color: var(--color-text-primary); font-size: 1.125rem; line-height: 1.35; }
.teachers-bio_fact .hero-icon { margin-top: 0.0625rem; }
@media (min-width: 48rem) {
  .teachers-bio_list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .teachers-bio_card { gap: 1.5rem; padding: 1.5rem; }

}
@media (min-width: 64.0625rem) {
  .teachers-bio_card { padding: 2rem; }
  .teachers-bio_photo.is-placeholder { font-size: 4rem; }
}

/* ===== Удостоверение — «Документ с фото человека» из библиотеки (13.10.2026, как на «Нарративной практике») =====
   Белая карточка: текст слева, фото выпускницы справа. Телефон: фото квадратом под текстом. С 768px две колонки,
   фото тянется на высоту текста. Галочки условий тёмные, сиреневый — только акцент в заголовке. */
.document_component { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, 1fr); overflow: clip; border-radius: var(--radius-card, 1rem); background: var(--color-surface-primary); }
.document_copy { display: flex; min-width: 0; flex-direction: column; gap: 1.25rem; padding: 1.5rem; overflow-wrap: anywhere; }
.document_heading { text-wrap: balance; }
.document_terms { display: grid; gap: 0.75rem; margin: 0; padding: 0; list-style: none; }
.document_term { display: flex; align-items: flex-start; gap: 0.625rem; color: var(--color-text-primary); font-size: 1rem; line-height: 1.35; text-wrap: pretty; }
.document_term .hero-icon { margin-top: 0.0625rem; }
.document_license { --body-text-color: var(--color-text-secondary-large); }
.document_media { position: relative; aspect-ratio: 1; background: var(--color-page-background); }
.document_image { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
@media (min-width: 48rem) {
  .document_component { grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); }
  .document_copy { justify-content: center; padding: 2.5rem; }
  .document_term { font-size: 1.125rem; }
  .document_media { aspect-ratio: auto; height: 100%; min-height: 22rem; }
  /* Кадр смещён вниз, чтобы удостоверение в руках не обрезалось, когда фото ниже своей ширины. */
  .document_image { object-position: center 70%; }
}
@media (min-width: 64.0625rem) {
  .document_copy { padding: 3.5rem; }
  .document_term { font-size: 1.25rem; }
  /* Условий получения в ТЗ нет, текст короткий: без запаса высоты фото обрезало бы удостоверение в руках. */
  .document_media { min-height: 32rem; }
}

/* ===== Стоимость — утверждённый блок «Одна цифра» с витрины /pricing-scenarios (сценарий «одна цена») =====
   Заголовок секции, горизонтальная белая карточка, под ней «Гибкие условия оплаты» подзаголовком.
   Карточка: телефон — цена сверху, «Что входит» под линией; с 768px две половины через вертикальную линию.
   Цена спокойного размера, «₽» мельче и серым; выгода — единственный фиолетовый акцент. Кнопок в блоке нет. */
.price-block_component { gap: 2rem; color: var(--color-text-primary); }
.price-wide_component { display: grid; width: 100%; min-width: 0; grid-template-areas: "main" "side"; grid-template-columns: minmax(0, 1fr); border-radius: var(--radius-card, 1rem); background: var(--color-surface-primary); }
.price-wide_main { display: flex; min-width: 0; flex-direction: column; grid-area: main; padding: 1.5rem; }
.price-wide_chip { align-self: flex-start; padding: 0.4375rem 0.75rem; border-radius: 6rem; background: var(--color-page-background); color: var(--color-text-primary); font-size: 0.875rem; font-weight: 500; line-height: 1; }
.price-wide_title { display: flex; flex-direction: column; gap: 0.375rem; margin-top: 1.25rem; }
.price-wide_name { font-size: clamp(1.5rem, 1.3rem + 0.6vw, 1.875rem); font-weight: 500; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.price-wide_sub { color: var(--color-text-secondary-large); font-size: 1rem; line-height: 1.4; }
.price-wide_money { margin-top: auto; padding-top: 2rem; }
.price-wide_side { display: flex; min-width: 0; flex-direction: column; gap: 1rem; grid-area: side; padding: 1.5rem; border-top: 1px solid rgb(51 47 65 / 12%); }
.price-wide_side-title { font-size: 1.125rem; font-weight: 500; line-height: 1.25; }
.price-tag { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.375rem; margin: 0; color: var(--color-text-primary); }
.price-tag_number { font-size: clamp(2.5rem, 2rem + 1.6vw, 3.25rem); font-weight: 500; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
.price-tag_unit { color: var(--color-text-secondary-large); font-size: 1.75rem; font-weight: 444; line-height: 1; letter-spacing: -0.02em; }
.price-caption { display: flex; flex-direction: column; gap: 0.125rem; margin-top: 0.75rem; color: var(--color-text-secondary-large); font-size: 1rem; line-height: 1.4; }
.price-caption_benefit { color: var(--color-accent-text); font-weight: 600; }
.price-check { display: flex; flex-direction: column; gap: 0.75rem; margin: 0; padding: 0; list-style: none; color: var(--color-text-primary); font-size: 1rem; line-height: 1.4; }
.price-check_item { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); align-items: start; gap: 0.625rem; }
.price-check_item .hero-icon { margin-top: 0.0625rem; }
.price-terms_heading { font-size: clamp(1.75rem, 1.5rem + 1vw, 2.25rem); font-weight: 444; line-height: 1.1; letter-spacing: -0.03em; text-align: center; }
@media (min-width: 48rem) {
  .price-wide_component { grid-template-areas: "main side"; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .price-wide_main, .price-wide_side { padding: 2rem; }
  .price-wide_side { border-top: 0; border-left: 1px solid rgb(51 47 65 / 12%); }
  .price-check { font-size: 1.0625rem; }
}
@media (min-width: 64.0625rem) {
  .price-wide_component { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .price-wide_main, .price-wide_side { padding: 2.25rem 2.5rem; }
}

/* «Гибкие условия оплаты» — утверждённый блок из витрины /pricing-scenarios (12.10.2026). Без иконок и без
   фиолетового: заголовок, под ним три колонки «заголовок, под ним текст» — рассрочка, скидки, вычет —
   с вертикальными линиями между ними. На телефоне колонки встают друг под другом, линии становятся горизонтальными. */
.price-terms_component { display: flex; flex-direction: column; gap: 1.5rem; padding-top: 1rem; color: var(--color-text-primary); }
.price-terms_list { display: grid; grid-template-columns: minmax(0, 1fr); margin: 0; }
