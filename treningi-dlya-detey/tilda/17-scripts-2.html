<!-- ОБЩИЕ СКРИПТЫ 2/2. Последние T123, после всех секций и нативной формы Tilda, по порядку. -->
<script>
(() => {
const initialize = () => {
/* === treningi-dlya-detey/cms.js === */
/* Данные курса из CMS (Strapi) через Public API: название, дата старта, дни занятий, документ, объём
   в академических часах и цена. Где на странице они стоят, отмечено атрибутами:
     data-cms-title                  — название курса (заголовок первого экрана, карточка цены);
     data-cms-start="… {date}"       — дата старта, {date} → «4 марта» (первый экран, цена, форма, FAQ);
     data-cms-schedule="… {schedule}"— дни и время занятий, {schedule} → «по четвергам 17:00–20:00» (программа, цена, FAQ);
     data-cms-document               — документ об окончании (факты под первым экраном, цена);
     data-cms-hours="… {hours}"      — часы, {hours} → «60 академических часов» (первый экран, цена, FAQ);
     data-cms-price / data-cms-benefit / data-cms-installment / data-cms-rise — цена, строки под ней и повышение.
   Настройки (адрес API и слаг курса) — атрибуты data-cms-api и data-cms-course на секции цены.

   Один и тот же код работает дважды: при сборке (build.mjs берёт отсюда TreningiCms и вшивает в страницу снимок
   из data/api-course.json и data/api-catalog-entry.json) и в браузере (страница один раз спрашивает API
   и подменяет значения). Пустое поле в CMS или API не ответил — остаётся значение со сборки.
   Часы есть только в каталоге (/api/public/catalog), а туда попадают курсы с «показывать в каталоге».
   Правила цены — как в утверждённом блоке «Одна цифра»: крупно цена при оплате сразу, официальная цена —
   в рассрочку, разница — «выгода N ₽ при оплате сразу», платёж в месяц тихой строкой, ближайшее
   повышение — серой плашкой «С 26 ноября: 32 000 ₽ / подорожает на 2 000 ₽». */
(function () {
  var NBSP = ' ';
  var JOIN = '⁠';
  var OPEN = ['Идет набор', 'Идёт набор', 'Последний шанс', 'Старт в любое время'];
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var SHORT = /(^|[\s(«])(а|в|и|к|о|с|у|я|во|до|за|из|на|не|ни|но|об|от|по|со|без|для|над|под|при|про|\d+) /gi;

  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  // Неразрывный пробел после коротких слов и чисел, как в текстах со сборки.
  var nb = function (text) { return String(text).replace(SHORT, function (m, before, word) { return before + word + NBSP; }); };
  var digits = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP); };
  var rub = function (n) { return digits(n) + NBSP + '₽'; };

  // «60 академических часов», «81 академический час», «72 академических часа».
  function hoursPhrase(n) {
    var m10 = n % 10, m100 = n % 100;
    var word = m10 === 1 && m100 !== 11 ? 'академический час' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'академических часа' : 'академических часов';
    return n + NBSP + word;
  }
  // Дата из CMS («2027-03-04» или ISO-время) → «4 марта» по московскому времени.
  function dayMonth(value) {
    if (!value) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    var d = m ? {day: Number(m[3]), month: Number(m[2]) - 1} : null;
    if (!d) {
      var t = new Date(new Date(value).getTime() + 3 * 3600 * 1000);
      if (isNaN(t)) return '';
      d = {day: t.getUTCDate(), month: t.getUTCMonth()};
    }
    return d.day + NBSP + MONTHS[d.month];
  }

  // Дни и время из CMS: «По средам 18:00–21:00» → «по средам 18:00–21:00»; если строки нет — по дням занятий
  // («Четверг» → «по четвергам»). Время не рвётся на тире.
  var DAY_PLURAL = {'Понедельник': 'понедельникам', 'Вторник': 'вторникам', 'Среда': 'средам', 'Четверг': 'четвергам', 'Пятница': 'пятницам', 'Суббота': 'субботам', 'Воскресенье': 'воскресеньям'};
  function schedulePhrase(stream) {
    if (!stream) return '';
    var text = String(stream.schedule || '').trim();
    if (!text) {
      var days = (stream.lessonDays || []).map(function (d) { return DAY_PLURAL[d]; }).filter(Boolean);
      if (!days.length) return '';
      text = 'по ' + (days.length === 1 ? days[0] : days.slice(0, -1).join(', ') + ' и ' + days[days.length - 1]);
    }
    text = text.replace(/\s*[–—-]\s*(?=\d{1,2}:\d{2})/g, JOIN + '–' + JOIN);
    return text.charAt(0).toLowerCase() + text.slice(1);
  }

  /* Ответ /api/public/course/:slug → то, что нужно странице. Берётся ближайший открытый поток.
     Тарифы этот лендинг не показывает: курс с тарифами оставляет цену со сборки. */
  function fromApi(course) {
    if (!course || !course.slug) return null;
    var open = (course.streams || []).filter(function (s) { return OPEN.indexOf(s.status) !== -1; })
      .sort(function (a, b) { return new Date(a.startDate || 0) - new Date(b.startDate || 0); });
    var stream = open[0] || course.nearestStream || null;
    var p = stream && stream.pricing;
    var price = null;
    if (p && !p.hasTariffs && p.currentPrice != null) {
      var list = p.currentPrice;
      var sale = p.fullPaymentPrice != null ? p.fullPaymentPrice : list;
      var next = p.nextPriceChange && p.nextPriceChange.at ? p.nextPriceChange : null;
      price = {
        sale: sale,
        list: list,
        perMonth: p.installmentPerMonth || (list > 0 ? Math.round(list / 24) : null),
        months: p.installmentPerMonth ? p.installmentMonths : 24,
        next: next ? {label: dayMonth(next.at), price: next.fullPaymentPrice != null ? next.fullPaymentPrice : next.price} : null,
      };
    }
    return {
      title: course.title || null,
      start: stream ? dayMonth(stream.startDate) : '',
      startDate: stream && stream.startDate || null,
      schedule: schedulePhrase(stream),
      document: (course.documents || [])[0] || '',
      price: price,
    };
  }

  // Строки под ценой: выгода (если есть отдельная цена при оплате сразу) и платёж в рассрочку.
  function benefitHtml(price) {
    return price.list > price.sale ? '<b class="price-caption_benefit">выгода ' + rub(price.list - price.sale) + '</b> при оплате сразу' : '';
  }
  function installmentHtml(price) {
    return price.perMonth ? 'или ' + digits(price.perMonth) + NBSP + '₽' + JOIN + '/' + JOIN + 'мес в' + NBSP + 'рассрочку на' + NBSP + price.months + NBSP + 'мес' : '';
  }

  // Ближайшее повышение цены: серая плашка под ценой, только если новая цена выше текущей.
  var ICON_RISE = '<svg class="price-rise_icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 17l6-6 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function riseHtml(price) {
    if (!price.next || !(price.next.price > price.sale) || !price.next.label) return '';
    return '<p class="price-rise">' + ICON_RISE + '<span class="price-rise_text"><span class="price-rise_title">С' + NBSP + price.next.label + ': ' + rub(price.next.price) + '</span><span class="price-rise_note">подорожает на' + NBSP + rub(price.next.price - price.sale) + '</span></span></p>';
  }

  var api = {fromApi: fromApi, riseHtml: riseHtml, schedulePhrase: schedulePhrase, dayMonth: dayMonth, hoursPhrase: hoursPhrase, benefitHtml: benefitHtml, installmentHtml: installmentHtml, digits: digits, nb: nb, esc: esc};
  globalThis.TreningiCms = api;
  if (typeof document === 'undefined') return;

  var root = document.querySelector('[data-cms-course]');
  if (!root || !window.fetch) return;
  var base = root.getAttribute('data-cms-api');
  var slug = root.getAttribute('data-cms-course');
  var each = function (selector, fn) { Array.prototype.forEach.call(document.querySelectorAll(selector), fn); };
  var fill = function (attr, key, value) {
    each('[' + attr + ']', function (el) { el.textContent = el.getAttribute(attr).replace(key, value); });
  };

  function applyCourse(course) {
    var model = fromApi(course);
    if (!model) return;
    if (model.title) each('[data-cms-title]', function (el) { el.textContent = nb(model.title); });
    if (model.start) fill('data-cms-start', '{date}', model.start);
    // Дни из CMS без времени («по четвергам») не затирают более подробную строку со сборки
    // («по четвергам с 17:00 до 20:00»): заменяем, только если в CMS что-то другое.
    if (model.schedule) each('[data-cms-schedule]', function (el) {
      var next = el.getAttribute('data-cms-schedule').replace('{schedule}', model.schedule);
      var flat = function (t) { return String(t).replace(/[\s\u00a0\u2060]+/g, ' ').trim(); };
      if (flat(el.textContent).indexOf(flat(next)) !== 0) el.textContent = next;
    });
    if (model.document) each('[data-cms-document]', function (el) { el.textContent = nb(model.document); });
    if (model.price) {
      each('[data-cms-rise]', function (el) { var html = riseHtml(model.price); el.innerHTML = html; el.hidden = !html; });
      each('[data-cms-price]', function (el) { el.textContent = digits(model.price.sale); });
      each('[data-cms-benefit]', function (el) { var html = benefitHtml(model.price); el.innerHTML = html; el.hidden = !html; });
      each('[data-cms-installment]', function (el) { var html = installmentHtml(model.price); el.innerHTML = html; el.hidden = !html; });
    }
    // Микроразметка курса: цена и дата старта те же, что на странице.
    each('script[type="application/ld+json"]', function (el) {
      try {
        var ld = JSON.parse(el.textContent);
        if (ld['@type'] !== 'Course') return;
        if (model.title) ld.name = model.title;
        if (model.startDate && ld.hasCourseInstance) ld.hasCourseInstance.startDate = model.startDate;
        if (model.price) ld.offers = {'@type': 'Offer', price: String(model.price.sale), priceCurrency: 'RUB', availability: 'https://schema.org/InStock', url: ld.url};
        el.textContent = JSON.stringify(ld);
      } catch (error) { /* разметка не тронута */ }
    });
  }

  var json = function (path) {
    return fetch(base + path, {headers: {Accept: 'application/json'}}).then(function (response) { return response.ok ? response.json() : null; });
  };
  // Курс: название, старт, дни, документ, цена.
  json('/api/public/course/' + slug).then(applyCourse).catch(function () { /* API недоступен — значения со сборки */ });
  // Часы — из каталога; курса там нет (не показывается в каталоге) — часы со сборки.
  json('/api/public/catalog')
    .then(function (catalog) {
      var found = null;
      (function walk(o) {
        if (found || !o || typeof o !== 'object') return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        if (o.slug === slug) { found = o; return; }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(catalog);
      var hours = found && Number(found.hours);
      if (hours) fill('data-cms-hours', '{hours}', hoursPhrase(hours));
    })
    .catch(function () { /* каталог недоступен — часы со сборки */ });
})();

/* === treningi-dlya-detey/page.js === */
// «Когда упражнения есть, а тренинга не получается»: сообщения один раз появляются по очереди, затем ответ Академии,
// когда блок попадает на экран. Без скрипта и при «уменьшить движение» видно всё сразу.
// Повторный запуск (редактор и превью Тильды) сначала снимает прежнее наблюдение.
(() => {
  window.__treningiDialogCleanup?.();
  const observers = [];
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
    document.querySelectorAll('[data-js="pains-reply"]').forEach(root => {
      root.querySelectorAll('.pains-reply_bubble, .pains-reply_answer').forEach((item, i) => item.style.setProperty('--message-index', i));
      root.classList.add('is-reveal-ready');
      const observer = new IntersectionObserver(entries => {
        if (!entries[0].isIntersecting) return;
        root.classList.add('is-revealed');
        observer.disconnect();
      }, {threshold: 0.2});
      observer.observe(root);
      observers.push(observer);
    });
  }
  window.__treningiDialogCleanup = () => observers.forEach(observer => observer.disconnect());
})();

/* Программа курса: табы модулей (перенесено с /rodbt без изменений логики). Кнопки модулей связаны с панелями через
   aria-controls; стрелки ходят по списку; при переключении панель коротко выезжает сбоку, при reduced motion
   переключение мгновенное. Повторный запуск снимает прошлые обработчики (редактор Тильды перезапускает скрипты).
*/
(() => {
  window.__treningiProgramTabsCleanup?.();
  const controller = new AbortController();
  const {signal} = controller;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const blocks = [...document.querySelectorAll('[data-program-tabs]')];
  if (!blocks.length) return;

  blocks.forEach((block) => {
    const tabs = [...block.querySelectorAll('[data-program-tab]')];
    const panels = [...block.querySelectorAll('[data-program-panel]')];
    if (!tabs.length || !panels.length) return;
    block.setAttribute('data-ready', '');

    const select = (tab) => {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
      });
      const targetId = tab.getAttribute('aria-controls');
      panels.forEach((panel) => {
        const isTarget = panel.id === targetId;
        panel.hidden = !isTarget;
        panel.classList.remove('is-entering');
        if (isTarget && !reducedMotion.matches) {
          void panel.offsetWidth;
          panel.classList.add('is-entering');
        }
      });
    };

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => select(tab), {signal});
      tab.addEventListener('keydown', (event) => {
        const delta = {ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1}[event.key];
        const jump = {Home: 0, End: tabs.length - 1}[event.key];
        if (delta === undefined && jump === undefined) return;
        event.preventDefault();
        const next = tabs[jump ?? (index + delta + tabs.length) % tabs.length];
        next.focus();
        select(next);
      }, {signal});
    });
    select(tabs.find((tab) => tab.getAttribute('aria-selected') === 'true') || tabs[0]);
  });

  window.__treningiProgramTabsCleanup = () => {
    controller.abort();
    blocks.forEach((block) => {
      block.removeAttribute('data-ready');
      block.querySelectorAll('[data-program-panel]').forEach((panel) => { panel.hidden = false; panel.classList.remove('is-entering'); });
    });
    delete window.__treningiProgramTabsCleanup;
  };
})();
};
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, {once: true});
else initialize();
})();
</script>
