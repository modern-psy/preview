/* ---------- 0. Цвета и общее ----------

/* ---------- 2. Почему коучинг, а не психотерапия ----------

   Поля 16 px, на компьютере 24 px.

   Компьютер (от 1025 px): три колонки (признак, коучинг, психотерапия), подписи колонок одной строкой сверху,

/* ---------- 4. Как вы будете учиться ----------
   Белая плашка: пять шагов, номер в сером кружке, кружки соединены тонкой линией; рядом фото.
   Шаг: название (content-heading is-compact) и пояснение (is-caption). Поля 16 px, на компьютере 24 px.

.adhd-adult-page .adhd-adult-format_plate {
  display: grid;
  gap: 1.5rem;
  padding: var(--card-padding);
  border-radius: var(--radius-card, 1rem);

}

.adhd-adult-page .adhd-adult-format_step:not(:last-child)::before {
  content: "";
  position: absolute;
  left: 1.25rem;

.adhd-adult-page .adhd-adult-format_photo {
  display: block;

  object-fit: cover;

   Карточка семинара как «Программа» на /adult-adhd-therapy: тёмная шапка с названием (content-heading is-card)

   Поля 16 px, на компьютере 24 px.
   Телефон и планшет — столбиком, от 1025 px два семинара рядом. */
.adhd-adult-page .adhd-adult-program_list { display: grid; gap: var(--card-grid-gap); }

  display: flex;
