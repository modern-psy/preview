<!DOCTYPE html>
<!--
  ============================================================================
  ПРОТОТИП РАСПИСАНИЯ · ВАРИАНТ B «УКАЗАТЕЛЬ КУРСОВ»

  Каждый курс — одна строка, сколько бы у него ни было потоков.
  Потоки — «билетики» с датой, днями занятий и ценой; ближайший выделен.
  Сверху поиск и разделы как в каталоге, сортировка «ближайшие / А–Я».

  Данные живые: core.js сводит /api/public/timetable и /api/public/catalog.
  Это прототип для сравнения, а не боевая страница.
  ============================================================================
-->
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Расписание · вариант B · указатель курсов</title>
  <meta name="description" content="Прототип расписания Академии: каждый курс со всеми ближайшими потоками." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/design-system/tokens.css" />
  <link rel="stylesheet" href="/design-system/base.css" />
  <link rel="stylesheet" href="/design-system/typography.css" />
  <link rel="stylesheet" href="/design-system/components.css" />

  <link rel="stylesheet" href="/timetable-variants/shared.css" />
  <link rel="stylesheet" href="/timetable-variants/b.css" />
</head>

<body>
  <div class="page-wrapper">

    <!-- 🔴 Служебная полоса для сравнения вариантов. На сайт не переносится. -->
    <nav class="prototype-bar_component" aria-label="Варианты прототипа">
      <div class="padding-global">
        <div class="container-large">
          <div class="prototype-bar_inner text-size-caption-md">
            <span class="prototype-bar_label">Прототип расписания</span>
            <a class="prototype-bar_link" href="/timetable-variants/a.html">Вариант A</a>
            <a class="prototype-bar_link" href="/timetable-variants/a-status.html">A с «Идёт набор»</a>
            <a class="prototype-bar_link is-current" href="/timetable-variants/b.html" aria-current="page">Вариант B</a>
            <a class="prototype-bar_link" href="/timetable-variants/c.html">Вариант C</a>
            <a class="prototype-bar_link" href="https://modernpsy.academy/timetable" target="_blank" rel="noopener">Как сейчас</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="main-wrapper">
      <section class="section_timetable">
        <div class="padding-global">
          <div class="container-medium">
            <div class="padding-section-small">

              <!-- 🟢 Заголовок страницы — текст можно менять -->
              <header class="timetable-head_component margin-bottom margin-medium">
                <h1 class="timetable-head_title heading-style-h2">Расписание обучения и&nbsp;мероприятий</h1>
                <p class="text-size-paragraph-md text-color-secondary">Даты стартов, стоимость и&nbsp;статус набора. Обновляется автоматически.</p>
              </header>

              <!-- Поиск — главный вход: человек чаще всего знает, какой курс ищет -->
              <div class="form_field index-search_component">
                <label class="visually-hidden" for="search">Найти курс по названию или методу</label>
                <span class="index-search_icon icon is-md" style="--icon-url:url('/timetable-variants/icons/search.svg')" aria-hidden="true"></span>
                <input class="form_input index-search_input" id="search" type="search" placeholder="Курс или метод, например КПТ" autocomplete="off" />
                <button class="index-search_clear" type="button" id="clearSearch" aria-label="Очистить поиск" hidden>
                  <span class="icon is-sm" style="--icon-url:url('/timetable-variants/icons/x.svg')" aria-hidden="true"></span>
                </button>
              </div>

              <!-- Липкая полоса разделов -->
              <div class="index-bar_component" id="indexBar">
                <div class="tabs_component index-bar_tabs" id="tabs" role="group" aria-label="Разделы"></div>
              </div>

              <!-- Порядок списка -->
              <div class="index-tools_component">
                <div class="index-bar_sort" role="group" aria-label="Порядок">
                  <span class="text-size-caption-md text-color-secondary">Порядок:</span>
                  <button class="index-bar_sort-option text-size-caption-md" type="button" data-sort="date" aria-pressed="true">ближайшие</button>
                  <button class="index-bar_sort-option text-size-caption-md" type="button" data-sort="az" aria-pressed="false">по алфавиту</button>
                </div>
              </div>

              <!-- 🔴 Список курсов — рисует код -->
              <div class="index-list_component" id="list" aria-live="polite"></div>

              <p class="timetable-note_component text-size-caption-sm margin-top margin-medium" id="sourceNote" hidden></p>

            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/timetable-variants/core.js" defer></script>
  <script src="/timetable-variants/b.js" defer></script>
</body>
</html>
