<!DOCTYPE html>
<!--
  ============================================================================
  РАСПИСАНИЕ АКАДЕМИИ · УТВЕРЖДЁННЫЙ ВАРИАНТ

  У курсов месяцев и «Старта в любое время» у названия зелёная метка
  «Идёт набор». Оформление включается атрибутом data-status у body.
  В «Ещё можно успеть» — индикатор «Последний шанс» в цвете warning.

  Порядок страницы:
    1. Ивент первым блоком — выбирается вручную в a.js (FEATURED),
       автоматики нет: конференция, вебинар или что-то ещё.
    2. Навигатор по дням недели: человек отмечает свободные дни,
       в списке остаются курсы с занятиями хотя бы в один из выбранных дней.
    3. «Ещё можно успеть» — присоединение к уже стартовавшим потокам. Всегда раскрыт.
    4. Потоки по месяцам. Дни занятий в строке — кружочками.

  Мини-курсов здесь нет: у них нет даты, им место в каталоге.
  Данные живые: core.js сводит /api/public/timetable и /api/public/catalog.
  Предыдущие варианты удалены; страница выбора ведёт сюда.
  ============================================================================
-->
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Расписание — Академия современной психологии</title>
  <meta name="description" content="Расписание Академии: ближайший вебинар, подбор потоков по дням недели и даты старта курсов." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;444;500;600&display=swap" rel="stylesheet" />

  <!-- 🔴 Дизайн-система сайта — те же файлы, что у боевого /timetable -->
  <link rel="stylesheet" href="/design-system/tokens.css" />
  <link rel="stylesheet" href="/design-system/base.css" />
  <link rel="stylesheet" href="/design-system/typography.css" />
  <link rel="stylesheet" href="/design-system/components.css" />

  <link rel="stylesheet" href="/timetable-variants/shared.css" />
  <link rel="stylesheet" href="/timetable-variants/a.css" />
  <link rel="stylesheet" href="/timetable-variants/a-status-type.css?v=20261012-1" />
  <link rel="stylesheet" href="/timetable-variants/a-status.css?v=20261012-18" />
</head>

<body data-status>
  <div class="page-wrapper">

    <!-- 🟢 Логотип Академии; ссылка ведёт на основной сайт. -->
    <header class="timetable-header_component">
      <div class="padding-global">
        <div class="container-large">
          <a class="timetable-header_brand" href="https://modern-psy.ru/" aria-label="Академия современной психологии — на главную">
            <img class="timetable-header_logo" src="/timetable-variants/icons/logo-asp.svg" width="84" height="30" alt="АСП" />
          </a>
        </div>
      </div>
    </header>

    <main class="main-wrapper">
      <section class="section_timetable">
        <div class="padding-global">
          <div class="container-large">
            <div class="padding-bottom padding-xlarge">

              <h1 class="visually-hidden">Расписание</h1>

              <!-- 1. ИВЕНТ ПЕРВЫМ БЛОКОМ. Какой именно — задаётся в a.js, FEATURED.
                   Если ивент не задан или уже прошёл, блока нет. -->
              <div id="featured"></div>

              <!-- 2. НАВИГАТОР ПО ДНЯМ НЕДЕЛИ -->
              <section class="card planner_component" id="picker" aria-labelledby="pickerTitle">
                <div class="planner_days-part">
                  <div class="planner_text">
                    <h2 class="content-heading_component is-card" id="pickerTitle">В какие дни вам удобно заниматься?</h2>
                    <p class="body-text_component is-caption text-color-secondary">Выберите дни&nbsp;— покажем курсы с&nbsp;занятиями хотя&nbsp;бы в&nbsp;один из&nbsp;них.</p>
                  </div>
                  <!-- 🔴 Кнопки дней рисует код -->
                  <div class="day-picker_component" id="dayPicker" role="group" aria-label="Свободные дни"></div>
                </div>
                <button class="button is-sm is-link planner_reset" type="button" id="resetDays" hidden>Сбросить дни</button>
              </section>

              <!-- Липкая строка: какие дни выбраны, когда навигатор уехал за экран -->
              <div class="planner-sticky_component" id="stickyBar" hidden>
                <p class="body-text_component is-caption text-color-primary" id="stickyText"></p>
                <button class="button is-sm is-secondary" type="button" id="stickyEdit">Изменить</button>
              </div>

              <!-- 3. ПОТОКИ ПО МЕСЯЦАМ — рисует код -->
              <div class="timetable-list_component" id="list"></div>

              <p class="timetable-note_component body-text_component is-fine-print margin-top margin-medium" id="sourceNote" hidden></p>

            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/timetable-variants/core.js?v=20261012-10" defer></script>
  <script src="/timetable-variants/a.js?v=20261012-7" defer></script>
</body>
</html>
