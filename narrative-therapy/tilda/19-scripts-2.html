<!-- ОБЩИЕ СКРИПТЫ 2/2. Последние T123, после всех секций и нативной формы Tilda, по порядку. -->
<script>
(() => {
const initialize = () => {
/* === narrative-therapy/page.js === */
/* Проектный скрипт лендинга «Основы нарративной практики».
   1. Схемы ситуаций (блок «Где можно применять»): анимация идёт, только пока схема видна на экране,
      остальные стоят на паузе — так страница не тратит ресурсы на все шесть циклов сразу.
      Без скрипта анимации просто идут всегда.
   2. Программа обучения: модули слева, темы выбранного модуля справа (до 1025px аккордеон).
   3. Лента «Доказательной базы» со стрелками.
   Повторный запуск снимает прошлые обработчики (Tilda может перезапускать скрипты). */
(() => {
  window.__narrativeTherapyCleanup?.();
  const controller = new AbortController();
  const {signal} = controller;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const scenes = [...document.querySelectorAll('[data-scene]')];
  let observer = null;
  if ('IntersectionObserver' in window) {
    observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => entry.target.toggleAttribute('data-in-view', entry.isIntersecting));
    }, {rootMargin: '0px 0px -10% 0px'});
    scenes.forEach((scene) => {
      scene.setAttribute('data-scene-observed', '');
      observer.observe(scene);
    });
  }

  /* 2. Программа обучения (topic-tabs). Кнопка модуля связана со своей панелью через aria-controls и aria-expanded;
     открыт всегда один модуль. До 1025px это аккордеон: панель раскрывается под кнопкой, и если кнопка уехала
     выше экрана, страница подкручивается к ней. От 1025px те же кнопки работают как вкладки слева от панели.
     Без скрипта видны все панели. */
  const topicBlocks = [...document.querySelectorAll('[data-topic-tabs]')];
  topicBlocks.forEach((block) => {
    const tabs = [...block.querySelectorAll('[data-topic-tab]')];
    const panels = [...block.querySelectorAll('[data-topic-panel]')];
    if (!tabs.length || tabs.length !== panels.length) return;
    block.setAttribute('data-ready', '');

    const select = (tab, {animate = true} = {}) => {
      const targetId = tab.getAttribute('aria-controls');
      tabs.forEach((item) => item.setAttribute('aria-expanded', String(item === tab)));
      panels.forEach((panel) => {
        const isTarget = panel.id === targetId;
        panel.hidden = !isTarget;
        panel.classList.remove('is-entering');
        if (isTarget && animate && !reducedMotion.matches) {
          void panel.offsetWidth;
          panel.classList.add('is-entering');
        }
      });
      if (animate && tab.getBoundingClientRect().top < 0) tab.parentElement.scrollIntoView({block: 'start', behavior: reducedMotion.matches ? 'auto' : 'smooth'});
    };

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        if (tab.getAttribute('aria-expanded') !== 'true') select(tab);
      }, {signal});
    });
    select(tabs.find((tab) => tab.getAttribute('aria-expanded') === 'true') || tabs[0], {animate: false});
  });


  /* 3. Лента «Доказательной базы» (вариант 4, перенесена из «Психосоматики»). Стрелки листают ленту на ширину
     одной карточки, у краёв стрелка гаснет. Листание анимируем сами через requestAnimationFrame: браузерный
     scrollBy({behavior: 'smooth'}) спорит со scroll-snap и в части браузеров дёргается. На время анимации снимаем
     с ленты snap и smooth и возвращаем в конце. Несколько быстрых нажатий складываются в одну анимацию. */
  const SLIDE_DURATION_MS = 400;
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const sliderFrames = [];
  document.querySelectorAll('[data-slider-controls]').forEach((controls) => {
    const track = document.querySelector(`[data-slider-track="${controls.dataset.sliderControls}"]`);
    const prev = controls.querySelector('[data-slider-prev]');
    const next = controls.querySelector('[data-slider-next]');
    if (!track || !prev || !next) return;

    const step = () => {
      const card = track.firstElementChild;
      if (!card) return track.clientWidth;
      return card.getBoundingClientRect().width + (parseFloat(getComputedStyle(track).columnGap) || 16);
    };
    const syncArrows = () => {
      prev.disabled = track.scrollLeft <= 1;
      next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 1;
    };
    let frameId = 0;
    let target = 0;
    let animating = false;
    const finish = () => {
      animating = false;
      track.style.scrollSnapType = '';
      track.style.scrollBehavior = '';
      syncArrows();
    };
    const slideTo = (value) => {
      target = Math.max(0, Math.min(track.scrollWidth - track.clientWidth, value));
      if (reducedMotion.matches) { track.scrollLeft = target; return; }
      cancelAnimationFrame(frameId);
      animating = true;
      track.style.scrollSnapType = 'none';
      track.style.scrollBehavior = 'auto';
      const from = track.scrollLeft;
      const start = performance.now();
      const frame = (now) => {
        const progress = Math.min(1, (now - start) / SLIDE_DURATION_MS);
        track.scrollLeft = from + (target - from) * easeInOutCubic(progress);
        if (progress < 1) frameId = requestAnimationFrame(frame);
        else finish();
      };
      frameId = requestAnimationFrame(frame);
    };
    sliderFrames.push(() => cancelAnimationFrame(frameId));
    const base = () => (animating ? target : track.scrollLeft);
    prev.addEventListener('click', () => slideTo(base() - step()), {signal});
    next.addEventListener('click', () => slideTo(base() + step()), {signal});
    // Человек взялся листать сам — уступаем ленту ему.
    track.addEventListener('pointerdown', () => {
      if (!animating) return;
      cancelAnimationFrame(frameId);
      finish();
    }, {signal});
    track.addEventListener('scroll', syncArrows, {passive: true, signal});
    window.addEventListener('resize', syncArrows, {signal});
    syncArrows();
  });

  window.__narrativeTherapyCleanup = () => {
    controller.abort();
    sliderFrames.forEach((cancel) => cancel());
    observer?.disconnect();
    scenes.forEach((scene) => scene.removeAttribute('data-scene-observed'));
    topicBlocks.forEach((block) => {
      block.removeAttribute('data-ready');
      block.querySelectorAll('[data-topic-panel]').forEach((panel) => { panel.hidden = false; panel.classList.remove('is-entering'); });
    });
    delete window.__narrativeTherapyCleanup;
  };
})();
};
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, {once: true});
else initialize();
})();
</script>
